<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="color-scheme" content="dark light">
<!-- Updated at boot by applyTokens() to the live palette's ocean color. The
     value here is the dark default, which is also what a first-time visitor
     gets (SPEC §9). -->
<meta name="theme-color" content="#070D18">
<title>Landfall</title>

<!-- PWA (SPEC §14 Phase 5). The apple-* metas are what iOS actually reads for
     home-screen installs; the manifest covers everything else. The status bar
     is black-translucent so the globe runs under it — safe-area insets above
     already keep the chrome clear of it. -->
<link rel="manifest" href="./manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Landfall">
<link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="./assets/icons/favicon-32.png">

<!--
  viewport-fit=cover + env(safe-area-inset-*) below is what lets the globe run
  edge to edge under the notch and the home indicator while the CONTROLS stay
  out of the OS gesture zones. SPEC §16's thumb-zone rule.
-->

<!-- MapLibre and Three are SERVED FROM OUR OWN ORIGIN (vendor/), not a CDN.
     SPEC §17 A3: a CDN blip during a storm was a black screen for anyone
     without a warm cache — a third party on the critical path of a
     safety-adjacent app. The files are committed, version-pinned in the
     filename, and byte-identical to the npm tarball they came from.
     No unpkg preconnect any more: there is nothing left to connect to. -->
<!-- The R2 preconnect is GONE (§17 Pass B). The coastline archive is read by
     functions/tiles/[[path]].js and reaches the browser as /tiles/{z}/{x}/{y}.mvt
     on our OWN origin — nothing in the app has fetched that bucket URL
     directly since the tile Function landed. A preconnect to a host nothing
     uses is a TLS handshake per page load, spent on a connection that is
     never used, on the one device where that costs something. Same reasoning
     that deleted the unpkg preconnect above: check what is left connecting
     before leaving a hint behind for it. -->
<link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
<link href="./vendor/maplibre-gl-5.6.0.css" rel="stylesheet">
<link href="./ui/panels.css" rel="stylesheet">
<link href="./ui/home.css" rel="stylesheet">
<link href="./ui/nudge.css" rel="stylesheet">

<style>
/* ---------------------------------------------------------------------------
 * These custom properties are the ONLY place tokens.js values are restated,
 * and they exist because CSS cannot import from a JS module. main.js writes
 * them from tokens.js at boot (see applyTokens), so tokens.js stays the single
 * source of truth and this block is just the fallback for first paint.
 * ------------------------------------------------------------------------- */
:root {
  --ocean: #070D18;
  --space: #04070E;
  --space-near: #0F1F38;
  --space-far: #010308;
  --text-primary: #E8F1F8;
  --text-secondary: #9DB3C7;
  --text-muted: #7089A5;
  --glass: rgba(10, 20, 34, 0.30);
  --glass-raised: rgba(16, 30, 48, 0.44);
  --glass-border: rgba(120, 190, 225, 0.16);
  --glass-shadow: rgba(0, 0, 0, 0.55);
  --scroll-thumb: rgba(120, 190, 225, 0.26);
  --scroll-thumb-hover: rgba(120, 190, 225, 0.46);
  --hover: rgba(120, 190, 225, 0.12);
  --focus-ring: #5FE0F5;
  --seg-active: #2B5175;
  --seg-active-edge: #4A7CA8;
  --switch-on: #5FE0F5;
  --install-cta: #F0B23C;
  --install-cta-ink: #1A1206;
  --install-cta-edge: #C98A1E;
  --error: #E85D5D;
  --stale: #E0A93C;
  --home-band-fill: rgba(224, 169, 60, 0.14);
  --home-band-edge: #C98A1E;

  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --font-numeric: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;

  /* ==> THE TYPE SCALE. SEVEN SIZES, AND THERE MAY NEVER BE AN EIGHTH. <==
   *
   * The drawers were carrying TWENTY-FIVE distinct font sizes: 0.72, 0.73,
   * 0.74, 0.75, 0.76, 0.78, 0.8, 0.82, 0.85, 0.875, 0.88, 0.9, 0.9375, 0.95
   * and up. Almost none of those differences were decisions — they were a
   * number typed while writing one component, never compared against the
   * component beside it. The effect on glass is what Aaron reported as "three
   * or four different fonts": there are only ever TWO typefaces in this app,
   * and every apparent third one was a size a few hundredths away from its
   * neighbour, which the eye reads as a different face rather than as a
   * mistake.
   *
   * A SIZE IS A ROLE, NOT A MEASUREMENT. Pick the step by what the text IS —
   * a section heading, a body sentence, a caption — and never by how big it
   * needs to look in one particular box. If a box needs a size that is not
   * here, the box is wrong, not the scale.
   *
   * The steps are roughly 1.1x apart, which is close enough to read as one
   * family and far enough apart that two adjacent steps are visibly a
   * hierarchy rather than a rendering wobble. That was the actual failure of
   * the old set: 0.85 against 0.875 is a 2% difference, which is invisible as
   * hierarchy and perfectly visible as sloppiness.
   *
   * `tools/type-scale-check.mjs` fails the push if any rule in ui/ declares a
   * raw font-size instead of one of these. A comment asking the next person
   * to use the scale is not a guard; this project learned that with the
   * fixture tokens in tools/drawer-head-harness.html. */
  --type-hero:  1.6rem;    /* one big figure, alone on its line */
  --type-xl:    1.25rem;   /* a panel's subject when it IS the panel */
  --type-title: 1.05rem;   /* drawer titles, the lede sentence */
  --type-lead:  0.95rem;   /* a row's name, a figure worth reading first */
  --type-body:  0.875rem;  /* default running text — the fallback answer */
  --type-small: 0.78rem;   /* the detail under a thing, captions, stamps */
  --type-micro: 0.6875rem; /* uppercase section headings and kickers ONLY */

  /* ==> ONE HEADER HEIGHT FOR ALL FIVE DRAWERS. <== The close X, the back
   * button and the title all centre inside this box, so pinning it is what
   * makes them land on the SAME LINE whichever drawer is open. Without it the
   * header is as tall as whatever title it happens to hold: the two storm
   * drawers put a two-line identity block in there and the other three put a
   * single <h1>, so flipping between them slid the X and every heading below
   * it by a few pixels. Small, constant, and exactly the kind of drift that
   * makes a set of panels read as separate screens rather than one surface.
   *
   * DERIVED, NOT TYPED: the tall case is the identity block, which is its
   * second line's fixed height plus one title line, plus the header's own
   * asymmetric padding. Written as a calc so a change to any of those moves
   * this with it instead of leaving a stale literal behind. */
  --identity-sub-h: 1.7rem;
  --drawer-head-h: calc(var(--identity-sub-h) + 1.3rem
                        + var(--space-snug) + var(--space-tight));

  /* ==> HOW FAR FROM THE SHEET'S EDGE A LINE OF TEXT STARTS, IN EVERY DRAWER.
   * <== Six drawers were running THREE different indents: 16px in the storm
   * list, Layers and Settings; 12px in the storm panel and the home
   * dashboard; 20px in the area panel. Nobody chose any of them — each is the
   * sum of a scroller's padding and whatever margin the component inside it
   * happened to carry. Flipping between drawers on a desktop, where the sheet
   * does not move, that shows up as every heading on the screen sliding
   * sideways, which is precisely the thing Aaron asked to stop.
   *
   * `--drawer-body-pad` is the SCROLLER's own padding and is deliberately
   * smaller: a storm row is a full-bleed press target and wants to run wider
   * than the text inside it. So each inner block makes up the difference with
   * `calc(var(--drawer-inset) - var(--drawer-body-pad))` rather than
   * restating a literal — same arithmetic-not-guesswork rule as
   * `--rail-node-top` in ui/home.css. Change the inset here and all six
   * drawers move together. */
  --drawer-body-pad: var(--space-snug);
  --drawer-inset: var(--space-comfy);

  --glass-blur: 8px;
  --glass-blur-raised: 6px;
  --touch-target: 44px;
  /* The slider thumb's diameter, in ONE place, because two things need the
     same number and they are in different languages: panels.css draws the
     circle, and ui/slider-grab.js measures where that circle is to decide
     whether a finger landed on it. A thumb that grew in CSS and not in JS
     would silently shrink the grab zone. `(pointer: coarse)` raises this on
     the control itself, and the JS reads the computed value, so both move
     together. */
  --slider-thumb: 20px;
  /* How tall the band is where scrolling content dissolves under the drawer
     header. It is BOTH the mask's fade distance and the scroller's top
     padding — the padding is what keeps the first row crisp at rest, because
     at scrollTop 0 the faded band covers empty space and nothing else. */
  /* How far the drawer body's top edge dissolves under the title, and — the
   * part that is easy to miss — the body's own top padding, which must match
   * it exactly. Shorter padding and the first line of content renders inside
   * the gradient, half-faded, which reads as a rendering fault; longer and it
   * is dead space above the thing the panel is about.
   *
   * Cut from 18px on glass 2026-08-11. It is a purely decorative gradient and
   * it was charging six pixels of every panel's most valuable real estate for
   * the privilege. tools/drawer-scroll-check.mjs holds the padding to it. */
  --scroll-fade: 12px;
  /* Mirrors SIZE.pillInset. Present here too so the pill is placed correctly
     on the very first paint, before app/theme-switch.js has run. */
  --pill-inset: 60px;
  /* Mirrors SIZE.pillMark, same first-paint reason as the inset above. */
  --pill-mark: 30px;
  --focus-ring-width: 2px;
  --focus-ring-offset: 2px;
  --globe-ring-width: 3px;
  --globe-ring-inset: 6px;
  --globe-ring-radius: 14px;
  --radius: 10px;

  /* ==> THE GLOW'S ONE NUMBER, AND THE REASON IT IS ONLY A NUMBER. <==
     A colored dot means the same thing wherever it appears — on the globe, in
     the storm list, beside the storm's name, and on the countdown rail (§6) —
     and the halo that makes it read as a severity statement rather than a
     bullet is part of that contract. So the RADIUS lives here, once.

     ==> WHAT CANNOT LIVE HERE IS THE WHOLE SHADOW, AND THAT MISTAKE COST
     THREE ROUNDS. <== The obvious consolidation is
     `--dot-glow: 0 0 8px var(--dot-ink)`, with each dot setting its own
     `--dot-ink`. It does not work, and it fails SILENTLY. A custom property
     whose value contains `var()` is substituted at computed-value time ON THE
     ELEMENT WHERE IT IS DECLARED — here, on `:root`. `:root` has no
     `--dot-ink`, so `--dot-glow` computes to `0 0 8px transparent` and every
     descendant inherits that. The dots kept their background and lost their
     halo entirely: not a duller glow, NO glow. Three passes were spent tuning
     ring, spread and opacity on a shadow that was transparent the whole time.

     So each site composes its own shadow from this radius and its own ink.
     One number, shared; one line each, local. That is as far as CSS custom
     properties actually reach, and pretending otherwise is what broke it. */
  --dot-glow-blur: 8px;
  /* A dot that is a HEDGE rather than an event — the earliest-arrival row on
     the countdown — mixes its ink down instead of changing the radius, so it
     is the same effect quieter and not a different one. */
  --dot-glow-hedge: 45%;
  --radius-large: 16px;

  --space-tight: 4px;
  --space-snug: 8px;
  --space-base: 12px;
  --space-comfy: 16px;

  --duration-instant: 90ms;
  --duration-base: 240ms;
  /* One full cycle of the waiting dots. Restated from DURATION.pulse in
     config/motion.js — slow enough to read as breathing rather than blinking,
     fast enough that a dot is lit at almost any glance. */
  --duration-pulse: 1400ms;
  --ease-settle: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-swap: cubic-bezier(0.4, 0, 0.2, 1);

  /* Safe areas, with a floor. On a device with no notch the inset is 0, and
     controls flush to the bottom edge are still wrong — the OS gesture bar is
     there regardless. The max() gives a minimum clearance either way. */
  --safe-top: max(env(safe-area-inset-top), 12px);
  --safe-bottom: max(env(safe-area-inset-bottom), 20px);
  --safe-left: max(env(safe-area-inset-left), 12px);
  --safe-right: max(env(safe-area-inset-right), 12px);

  /* How much of the screen the on-screen keyboard is covering. Written by
     ui/keyboard.js at runtime — declared here so every rule that reads it has
     a real value from first paint instead of falling back to nothing. */
  --keyboard-inset: 0px;
}

/* ---------------------------------------------------------------------------
 * LIGHT-MODE FIRST-PAINT FALLBACKS.
 *
 * Same job as the block above and the same rule: these are RESTATEMENTS of
 * tokens.js, not a second source of truth. main.js overwrites all of them with
 * the real values within a frame of boot. They exist so that a device set to
 * light mode does not get a black screen for the length of a module load over
 * cell data — which is exactly when someone is opening a shared link during a
 * storm.
 *
 * Keyed off `data-theme` on <html>, which the inline script below sets BEFORE
 * the first paint. A `prefers-color-scheme` media query would be wrong here:
 * the default is dark for everyone regardless of device (SPEC §9), so what
 * this has to match is the STORED PREFERENCE, not the OS.
 * ------------------------------------------------------------------------- */
:root[data-theme="light"] {
  --ocean: #C2C6CA;
  --space: #C2C6CA;
  --space-near: #EFF7FF;
  --space-far: #97999B;
  --text-primary: #15181B;
  --text-secondary: #414850;
  --text-muted: #565D64;
  --glass: rgba(252, 252, 251, 0.38);
  --glass-raised: rgba(255, 255, 255, 0.52);
  --glass-border: rgba(28, 32, 36, 0.18);
  --glass-shadow: rgba(20, 23, 26, 0.20);
  --scroll-thumb: rgba(28, 32, 36, 0.26);
  --scroll-thumb-hover: rgba(28, 32, 36, 0.46);
  --hover: rgba(28, 32, 36, 0.10);
  --focus-ring: #0B5FA0;
  --seg-active: #D9DCDF;
  --seg-active-edge: #59626A;
  --switch-on: #AEB3B8;
  --install-cta: #F0B23C;
  --install-cta-ink: #1A1206;
  --install-cta-edge: #8A5100;
  --error: #A81E16;
  --stale: #7D5100;
  --home-band-fill: rgba(125, 81, 0, 0.10);
  --home-band-edge: #7D5100;
}

* { box-sizing: border-box; }

/* ---------------------------------------------------------------------------
 * SCROLLBARS. The one surface in the app that was never ours.
 *
 * `color-scheme` (set on <html> by applyTokens) already tells the browser to
 * render a DARK scrollbar in the dark theme — and it does, in the operating
 * system's grey. Correct, and it reads as a piece of someone else's interface
 * bolted to the side of a night-sky panel.
 *
 * BOTH SYNTAXES, because they cover different browsers and neither is enough
 * alone: `scrollbar-color` is Firefox and recent Chromium, `::-webkit-` is
 * Safari and everything older. A browser that honours both takes the
 * pseudo-elements.
 *
 * The track stays TRANSPARENT deliberately. A panel is glass over a globe; a
 * filled gutter would be an opaque stripe down the side of it, and the thumb
 * alone is enough to say the content scrolls. `background-clip: padding-box`
 * with a transparent border is what insets the thumb without needing a track
 * to inset it against.
 * ------------------------------------------------------------------------- */
* {
  scrollbar-width: thin;
  scrollbar-color: var(--scroll-thumb) transparent;
}
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--scroll-thumb);
  border-radius: 999px;
  border: 3px solid transparent;
  background-clip: padding-box;
}
/* Hover only where there is a pointer that can hover — never branch on device
 * (SPEC §7). A touch device gets the resting color and nothing else. */
@media (hover: hover) {
  ::-webkit-scrollbar-thumb:hover { background: var(--scroll-thumb-hover); background-clip: padding-box; }
}

/* Set by the inline script below before first paint; also written by
   applyTokens() on every theme change. */


html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: var(--ocean);
  color: var(--text-primary);
  font-family: var(--font-ui);
  /* The page must NEVER scroll while the user is dragging the globe. */
  overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
}

/* --- The layer stack (SPEC §2 hybrid): space bg < MapLibre < 3D clear globe -
   MapLibre is the INPUT surface and owns the one zoom + camera; it starts at
   opacity 0 (you see the 3D globe) and globe3d.js fades it up as you zoom in.
   The #gl canvas on top is pointer-events:none — purely visual — so scroll,
   pinch, and drag all reach MapLibre everywhere. Opacity on #globe is driven
   per-frame, so it carries no CSS transition of its own.                      */
#spacebg {
  position: fixed;
  inset: 0;
  z-index: 0;
  background: radial-gradient(120% 120% at 42% 30%,
              var(--space-near) 0%, var(--space) 60%, var(--space-far) 100%);
  pointer-events: none;
}

/* Storm light thrown onto the backdrop (map/limb-glow.js).
 *
 * z-index 0, THE SAME AS #spacebg, and it sits after it in the document — so
 * paint order puts it above the gradient and below #globe. That is deliberate
 * rather than lazy: this layer's whole purpose is to blend with the CSS
 * gradient, and `mix-blend-mode` blends an element with what has already been
 * painted beneath it in its stacking context. Give it its own higher z-index
 * and every layer above would have to be renumbered for no gain.
 *
 * Being BELOW MapLibre is the load-bearing part, twice over: MapLibre fades up
 * over it during the dive exactly as it does over the gradient, and the Three
 * globe painting above means opaque continents cover the light behind them
 * while the transparent ocean lets it through. Both are free.
 *
 * The blend mode itself is set from JS, because it changes with the theme —
 * `screen` on a night sky, `multiply` on a daylight one. No default here: a
 * wrong one would show for one frame on boot. */
#glow {
  position: fixed;
  inset: 0;
  z-index: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  pointer-events: none;
}

#globe {
  position: fixed;
  inset: 0;
  z-index: 1;
  opacity: 0;             /* faded up by globe3d.js as you zoom into the map */
  /* Deliberate: the canvas owns all pointer gestures. Without this, a vertical
     drag on iOS Safari scrolls the page instead of panning the map. */
  touch-action: none;
}

/* The Three.js clear globe canvas — the top RENDER layer, but transparent to
   input so every gesture falls through to MapLibre below.
   width/height 100% is LOAD-BEARING: a canvas is a replaced element, so
   inset:0 positions it but does NOT stretch it — without these it displays at
   its raw pixel-buffer size (2-3x the screen on a phone), anchored top-left.
   That was the mobile "top-left quadrant" bug. At DPR 1 (desktop) buffer ==
   viewport and this changes nothing. */
#gl {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 2;
  display: block;
  pointer-events: none;
}

/* Home marker host. ABOVE both globe engines (#globe z1, #gl z2) and below the
   chrome, so the marker is visible across the entire dive — including the
   planet band, where #globe is still at opacity 0. Inert except for the
   off-screen pointer button, which re-enables pointer events on itself. */
#home-layer-host {
  position: fixed;
  inset: 0;
  z-index: 3;
  pointer-events: none;
}

/* The globe's focus ring.
 *
 * :focus-visible ALONE IS NOT ENOUGH HERE. #globe is a plain div made
 * focusable with tabindex; browsers apply the :focus-visible heuristic
 * inconsistently to non-form elements, so the ring silently failed to appear
 * when tabbing to the globe. Plain :focus is the reliable rule; the
 * :focus:not(:focus-visible) escape hatch below suppresses it for pointer
 * clicks, which is the behavior :focus-visible was wanted for in the first
 * place.
 *
 * ==> WHY IT IS INSET BY A WHOLE RING AND NOT BY 2px. <==
 * It was `outline-offset: -2px`, which draws the ring in the last two pixels
 * of the viewport — under the browser's own chrome at the top, inside the
 * phone's rounded corners at the bottom, and past the safe-area insets on
 * every side. Aaron tabbed to the globe on a phone and saw nothing. A ring
 * that is technically painted and never visible is not a focus indicator.
 *
 * ==> WHY IT IS A SIBLING AND NOT `#globe::after`. <==
 * It WAS a pseudo-element on #globe, and that made it the one focus ring in
 * the app whose color and opacity did not match the others. #globe's opacity
 * is driven PER FRAME by the dive crossfade (map/globe3d.js writes
 * `mapEl.style.opacity`), and a child cannot be more opaque than its parent —
 * so the ring faded out with the map canvas. Zoomed out on the 3D globe,
 * where #globe sits at opacity 0, the ring was invisible; mid-dive it was
 * washed out; only fully zoomed in was it correct. The opacity also opens a
 * stacking context, which buried it under #gl besides.
 *
 * So it lives outside the faded element, as its own fixed overlay lit by the
 * sibling combinator — no JS, no class to keep in sync, and nothing between
 * it and the user. Reported on glass by Aaron, 2026-07-28.
 *
 * The ring is drawn INSIDE the viewport edge, clear of the safe area, and
 * thicker than a button's because it has to read against a lit ocean rather
 * than against a glass panel. Paints on the compositor — no layout, no
 * repaint of either canvas. */
#globe:focus {
  outline: none;
}
#globe-ring {
  position: fixed;
  inset: calc(var(--globe-ring-inset) + env(safe-area-inset-top, 0px))
         calc(var(--globe-ring-inset) + env(safe-area-inset-right, 0px))
         calc(var(--globe-ring-inset) + env(safe-area-inset-bottom, 0px))
         calc(var(--globe-ring-inset) + env(safe-area-inset-left, 0px));
  border: var(--globe-ring-width) solid var(--focus-ring);
  border-radius: var(--globe-ring-radius);
  pointer-events: none;
  z-index: 45;              /* above both globe canvases, below the veil */
  display: none;
}
#globe:focus ~ #globe-ring {
  display: block;
}
#globe:focus:not(:focus-visible) ~ #globe-ring {
  display: none;
}

/* --- The boot screen (see the markup for why it exists) ------------------
 *
 * ONLY transform and opacity animate (§Performance). The spin is a compositor
 * job; nothing here causes layout or a repaint of anything behind it. */
#boot {
  position: fixed;
  inset: 0;
  z-index: 100;              /* above every surface — it covers the app */
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--space-base);
  background: var(--ocean);  /* MATCHES manifest background_color — that is
                              * what makes the hand-off from Android's own
                              * launcher splash invisible. Keep them equal. */
  color: var(--text-primary);
  opacity: 1;
  transition: opacity var(--duration-base) var(--ease-settle);
  /* Never eat a tap. If this is ever still up when the app is usable
   * underneath, the user must not be locked out by a decoration. */
  pointer-events: none;
}
#boot[data-done="true"] {
  opacity: 0;
}

#boot-mark {
  width: 88px;
  height: 88px;
  /* COUNTER-CLOCKWISE, matching the northern-hemisphere spiral the app draws
   * for real storms (map/glyph.js) — the mark is that same shape, so it must
   * not turn the wrong way.
   *
   * THE PULSE IS IN THE TIMING FUNCTION, NOT IN A SECOND ANIMATION. One 360°
   * turn per cycle, eased so it surges and eases rather than tracking at a
   * constant rate. A steady spin reads as a generic loader; the surge reads as
   * something winding up. One animation, one property, no keyframe stack. */
  animation: boot-spin 2.4s cubic-bezier(0.6, 0, 0.4, 1) infinite;
}
#boot-mark svg { width: 100%; height: 100%; display: block; }

@keyframes boot-spin {
  from { transform: rotate(0deg); }
  to   { transform: rotate(-360deg); }
}

#boot-name {
  margin: 0;
  font-family: var(--font-ui);
  font-size: 20px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-primary);
}

/* ==> THE FAILURE STATE. A SPINNER THAT SPINS FOREVER IS SILENCE (§5). <==
 * ui/boot.js reveals this after BOOT.stuckAfter with a reload action. Hidden
 * rather than absent so it costs no layout when it never fires. */
#boot-note {
  margin: 0;
  max-width: 24em;
  padding: 0 var(--space-comfy);
  text-align: center;
  font-family: var(--font-ui);
  font-size: 14px;
  line-height: 1.5;
  color: var(--text-secondary);
  opacity: 0;
  transition: opacity var(--duration-base) var(--ease-settle);
}
#boot-note[data-visible="true"] {
  opacity: 1;
  pointer-events: auto;      /* the reload link inside it must be tappable */
}
#boot-note button {
  margin-top: var(--space-snug);
  min-height: var(--touch-target);
  padding: 0 var(--space-comfy);
  font: inherit;
  color: var(--text-primary);
  background: var(--glass-raised);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  cursor: pointer;
}

@media (prefers-reduced-motion: reduce) {
  /* No spin at all. A gentle breath still says "working" without the rotation
   * that triggers motion sensitivity — and it is still transform-only. */
  #boot-mark {
    animation: boot-breathe 2.4s var(--ease-settle) infinite;
  }
  @keyframes boot-breathe {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.08); }
  }
}

/* --- Attribution: OURS, not MapLibre's (SPEC §9, §11) --------------------
 *
 * MapLibre's AttributionControl was removed after six failed attempts to
 * make it start collapsed. It re-expands itself from several event handlers
 * (`_updateAttributions` -> `_updateCompact` on styledata/sourcedata/terrain,
 * plus resize), it owns a native <details> whose `open` state toggles
 * independently, and it has no `collapsed` option — confirmed in the docs,
 * which state it "is expanded by default (regardless of map width)". Any fix
 * from outside is a third actor in a race it cannot win; the measured live
 * element showed our JS succeeding and being overwritten moments later, and
 * each attempt added a state setter that made the tap count worse.
 *
 * This control is ~40 lines, has no state machine to fight, and matches the
 * app's own icon language (24x24, currentColor, stroke 1.7 — §9). Attribution
 * is a licensing requirement, so it must be REACHABLE at all times; it does
 * not have to be asserted on arrival. The "i" is always visible, one tap
 * opens the credits, one tap closes them.
 *
 * THE TRADE, STATED PLAINLY: MapLibre's control derived its credits from the
 * style's sources automatically. Ours does not. The text lives in
 * map/attribution.js and MUST be updated if the tile source ever changes
 * (§11 — the current source is OpenFreeMap/OpenMapTiles). That is a
 * deliberate, documented decision, not something that drifts on its own.  */

/* ONE PILL THAT GROWS. Not a panel opening behind a button — that read as two
 * separate objects stacked, the same mistake the home pointer's enclosing
 * ring made (§9). The control is a single element whose width animates from
 * a 28px circle to fit its text.
 *
 * ON ANIMATING WIDTH. §9 says animate transform and opacity only, and that
 * rule stands for anything covering real area — a growing panel or a moving
 * marker. This is a 28px-tall chip in a corner: the layout it can invalidate
 * is its own, it composites over the globe rather than through it, and it
 * moves only on an explicit tap, never per-frame or during camera motion. A
 * transform: scaleX() would avoid the layout pass but stretch the glyph and
 * the type, which is exactly the "looks kinda shitty" being fixed here. The
 * width transition is the honest tool for a chip this size; do not "fix" it
 * into a scale.
 *
 * The height NEVER changes, so the pill cannot shift anything around it. */
#attrib-host .attrib {
  display: flex;
  align-items: center;      /* vertical centring for the text */
  gap: 0;
  /* THE BORDER IS PART OF THE BOX. With `box-sizing: border-box` (set
   * globally), a 28px-wide pill with a 1px border has only a 26px CONTENT
   * box — but the icon below is a fixed 28px that refuses to shrink, so it
   * overflowed by 2px, got clipped on the right by `overflow: hidden`, and
   * the glyph sat visibly left of centre in the closed state.
   *
   * Sizing the pill from the icon plus its own border keeps the collapsed
   * shape a true circle with the glyph dead centre, and stays correct if
   * either value changes (§12: derive, never hand-tune twice). */
  --attrib-size: 28px;
  --attrib-border: 1px;
  height: calc(var(--attrib-size) + var(--attrib-border) * 2);
  width: calc(var(--attrib-size) + var(--attrib-border) * 2);
  padding: 0;
  border: var(--attrib-border) solid var(--glass-border);
  border-radius: 999px;
  background: var(--glass-raised);
  backdrop-filter: blur(var(--glass-blur-raised));
  -webkit-backdrop-filter: blur(var(--glass-blur-raised));
  color: var(--text-secondary);
  font: inherit;
  font-size: 11px;
  line-height: 1;           /* no stray leading to fight the centring */
  cursor: pointer;
  /* ==> THE CLIP LIVES ON THE LABEL NOW, NOT HERE. <== `overflow: hidden` on
   * the pill clipped the label correctly and also clipped the 44px touch
   * target down to this 30px circle, because overflow clips hit-testing too.
   * The label carries its own clip-path instead, which hides the credits
   * without shrinking anything the finger is aiming at. */
  white-space: nowrap;
  position: relative;
  -webkit-appearance: none;
  appearance: none;
  transition: width var(--duration-base) var(--ease-settle),
              color var(--duration-base) var(--ease-settle);
}

/* The icon sits in a fixed square — the same box as the collapsed pill's
 * content area, so it does not shift by a pixel when the pill grows, and the
 * glyph stays optically centred in the circle. Sized from the same token as
 * the pill so the two cannot drift apart. */
#attrib-host .attrib-icon {
  flex: 0 0 var(--attrib-size);
  width: var(--attrib-size);
  height: var(--attrib-size);
  display: grid;
  place-items: center;
  /* Positioning context for the 44px hit overlay below — pinned to the pill
   * instead, the overlay would drift from the glyph as the pill grows. */
  position: relative;
}
#attrib-host .attrib-icon svg { width: 20px; height: 20px; display: block; }

/* The label. EQUAL OPTICAL INSETS on both sides: the icon's 28px box places
 * the glyph's right edge 7px before the text starts (a 14px glyph centred in
 * 28px), so the text's own left inset is that 7px gap, and the right padding
 * matches it at 7px plus the same 7px the glyph gets from the pill edge —
 * i.e. 14px total, so the text sits the same distance from the pill's right
 * edge as the glyph does from its left. Derived from the icon box and glyph
 * size rather than eyeballed (§12: derive, never hand-tune twice). */
#attrib-host .attrib-label {
  display: flex;
  align-items: center;
  height: 100%;
  /* Half the icon box: the same 7px the glyph gets from the pill edge, plus
   * the same 7px gap that sits between glyph and text. Derived from the icon
   * size so it tracks any change to it (§12). */
  padding-right: calc(var(--attrib-size) / 2);
  /* NEVER shrink. The label is clipped by the pill's overflow while
   * collapsed, but it must keep its full laid-out width — that width is what
   * JS measures to know how far to grow. A flex default of `shrink: 1` would
   * squeeze it to the collapsed pill and the measurement would read back the
   * collapsed size. */
  flex: 0 0 auto;
  opacity: 0;
  /* CLIP-PATH, NOT OVERFLOW ON THE PARENT. It hides the credits while the pill
   * is closed without clipping the pill's touch target, and — unlike a width
   * of 0 — it does not change `offsetWidth`, which is the number JS measures to
   * know how far to grow the pill. */
  clip-path: inset(0 100% 0 0);
  transition: opacity var(--duration-instant) var(--ease-settle);
}
#attrib-host .attrib[aria-expanded="true"] .attrib-label {
  clip-path: none;
  opacity: 1;
  /* Delayed so the text fades in as the pill finishes widening, rather than
   * appearing in a box that has not opened yet. */
  transition-delay: calc(var(--duration-base) * 0.4);
}

@media (hover: hover) {
  #attrib-host .attrib:hover { color: var(--text-primary); }
}
#attrib-host .attrib:focus-visible {
  outline: var(--focus-ring-width) solid var(--focus-ring);
  outline-offset: var(--focus-ring-offset);
}

/* ==> THE 44px TOUCH TARGET, AND WHY THE PILL NO LONGER CLIPS. <==
 *
 * This overlay was here before and measured 44px in the stylesheet, but it sat
 * inside a pill carrying `overflow: hidden` — and overflow clips HIT-TESTING as
 * well as painting, so the real target was the pill's own 30px circle. Under
 * the §10 minimum, in the file that states the minimum, and invisible to
 * anything but a finger.
 *
 * The pill's clip has moved to the label (see above), so this is a genuine
 * 44px now. It stays anchored to the ICON, which has its own positioning
 * context for the purpose — pinned to the pill it would drift as the pill
 * grows. It covers the icon only, so an expanded pill is not one giant button:
 * the credit links inside must stay individually tappable. */
#attrib-host .attrib-icon::after {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  width: var(--touch-target);
  height: var(--touch-target);
  transform: translate(-50%, -50%);
}

#attrib-host .attrib a {
  color: var(--text-secondary);
  text-decoration: underline;
  /* The links sit inside the button, so their taps must not also toggle it
   * shut; JS stops that propagation. This just keeps them reachable. */
  position: relative;
  z-index: 1;
}
@media (hover: hover) {
  #attrib-host .attrib a:hover { color: var(--text-primary); }
}

@media (prefers-reduced-motion: reduce) {
  /* Keep the fade, drop the travel — a transition of 0 makes state changes
   * hard to follow (§15). */
  #attrib-host .attrib { transition: color var(--duration-base) var(--ease-settle); }
}

/* --- Status strip: top edge. Silent when everything is clean (SPEC §16) -- */
#status {
  position: fixed;
  top: var(--safe-top);
  left: var(--safe-left);
  right: var(--safe-right);
  z-index: 20;
  display: flex;
  justify-content: center;
  pointer-events: none;
}

#status .chip {
  pointer-events: auto;
  padding: var(--space-snug) var(--space-base);
  background: var(--glass);
  backdrop-filter: blur(var(--glass-blur-raised));
  -webkit-backdrop-filter: blur(var(--glass-blur-raised));
  border: 1px solid var(--glass-border);
  border-radius: 999px;
  font-size: 12px;
  letter-spacing: 0.02em;
  color: var(--text-secondary);
  box-shadow: 0 4px 20px var(--glass-shadow);
  opacity: 0;
  transform: translateY(-6px);
  transition: opacity var(--duration-base) var(--ease-settle),
              transform var(--duration-base) var(--ease-settle);
}
#status .chip[data-visible="true"] { opacity: 1; transform: translateY(0); }
#status .chip[data-tone="error"] { color: var(--error); }
#status .chip[data-tone="stale"] { color: var(--stale); }

/* --- Control cluster: bottom-RIGHT vertical stack (SPEC §16) -------------
   Bottom-right because you may be holding a phone one-handed in the rain.
   Reachability beats keeping the globe unobscured.                         */
/* Attribution host — a SIBLING of #globe, never a child.
 *
 * MapLibre normally mounts its controls inside the map element, but #globe's
 * opacity is driven per-frame by the dive crossfade (globe3d.js). Opacity on a
 * parent composites everything inside it, so the attribution faded out with
 * the basemap and was nearly invisible at the space floor — while remaining
 * correct zoomed in. Chrome must never live inside an animating-opacity
 * element.
 *
 * Z-INDEX 20, BELOW THE DRAWER (30) — attribution is the LOWEST-priority
 * chrome in the app. It sat at 40 alongside #controls on the reasoning that
 * both were floating controls; that stopped being true when the drawer
 * arrived, and the "i" rendered over the bottom sheet's content. A licensing
 * credit must be present and legible, which it is at every zoom — it does
 * not have to be on top of a storm warning. */
#attrib-host {
  /* The pill is a single in-flow element, so this host only needs to place
   * it clear of the safe-area insets. */
  position: fixed;
  left: var(--safe-left);
  bottom: var(--safe-bottom);
  z-index: 20;
}

/* --- Map controls: bottom-right, clear of the OS gesture zone ------------ */
#controls {
  position: fixed;
  right: var(--safe-right);
  bottom: var(--safe-bottom);
  z-index: 40;
  display: flex;
  flex-direction: column;
  gap: var(--space-snug);
}

.control {
  width: var(--touch-target);
  height: var(--touch-target);
  display: grid;
  place-items: center;
  background: var(--glass-raised);
  backdrop-filter: blur(var(--glass-blur-raised));
  -webkit-backdrop-filter: blur(var(--glass-blur-raised));
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  color: var(--text-secondary);
  cursor: pointer;
  box-shadow: 0 4px 20px var(--glass-shadow);
  /* Transform and opacity ONLY. */
  transition: transform var(--duration-instant) var(--ease-swap),
              opacity var(--duration-instant) var(--ease-swap);
  -webkit-appearance: none;
  appearance: none;
  padding: 0;
}

.control svg { width: 20px; height: 20px; display: block; }

/* --- the morphing view control (compass <-> crosshair) -------------------
 * Both marks are stacked in the same grid cell and cross-faded. Swapping
 * innerHTML instead would rebuild the SVG on every bearing change — that is a
 * parse and a layer promotion per frame while the user is rotating, which is
 * exactly the per-frame DOM churn the marker code goes to such lengths to
 * avoid. Opacity on two static children costs nothing.                     */
.control-view > svg {
  grid-area: 1 / 1;
  transition: opacity var(--duration-instant) var(--ease-swap);
}
.control-view[data-mode="recenter"] .view-needle,
.control-view[data-mode="north"] .view-crosshair { opacity: 0; }
.control-view[data-mode="recenter"] .view-crosshair,
.control-view[data-mode="north"] .view-needle { opacity: 1; }

/* Rotated per frame from JS. Origin dead centre or the needle orbits the
 * button instead of pivoting on its own middle. NO transition here — this
 * tracks a live gesture and must not lag the globe under the user's fingers. */
.control-view .view-aim {
  transform-origin: 12px 12px;   /* the viewBox centre, not the element box */
  will-change: transform;
}

/* Capability, not device class. A touchscreen laptop gets both. */
@media (hover: hover) {
  .control:hover { color: var(--text-primary); transform: scale(1.04); }
}
.control:active { transform: scale(0.94); }

.control:focus-visible {
  outline: var(--focus-ring-width) solid var(--focus-ring);
  outline-offset: var(--focus-ring-offset);
  color: var(--text-primary);
}

.control[disabled] {
  opacity: 0.38;
  cursor: default;
}

/* --- Boot veil ----------------------------------------------------------
   Covers the moment between first paint and the globe having a style. Fades
   on opacity only. Without it you see a flash of flat background before the
   opening sequence starts, which reads as a stutter.                       */
#veil {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: var(--ocean);
  pointer-events: none;
  opacity: 1;
  transition: opacity 600ms var(--ease-settle);
}
#veil[data-lifted="true"] { opacity: 0; }

@media (prefers-reduced-motion: reduce) {
  * {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

/* Screen-reader-only. The canvas is aria-hidden; this is how the globe
   announces itself until the storm list exists in Phase 2. */
.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}
</style>

<!-- ---------------------------------------------------------------------------
  THEME, BEFORE THE FIRST PAINT.

  This runs synchronously in <head>, ahead of any rendering, so a device whose
  stored preference is Light never flashes the dark globe on its way to the
  light one. Doing it from main.js instead would be one full module load too
  late — over cell data that is a visible black flash, and cell data during a
  storm is the case this app exists for.

  DELIBERATELY DUPLICATES A LITTLE LOGIC, and the duplication is bounded to
  three lines: read the preference, collapse `auto` against the device, set an
  attribute. It cannot import config/theme.js — a module import is async and
  would defeat the entire point of being here. main.js re-resolves through the
  real code a moment later and overwrites this, so if the two ever disagree the
  real code wins and the only cost is the flash this was written to avoid.

  Reads the SAME record data/settings-prefs.js writes (`landfall.settings`), so
  there is no second storage key to keep in step. Wrapped in try/catch because
  localStorage throws in private mode with storage disabled, and a theme
  preference is never worth a blank page.
-------------------------------------------------------------------------- --><script>
(function () {
  var mode = 'dark'; // the default for everyone, regardless of device (SPEC §9)
  try {
    var pref = (JSON.parse(localStorage.getItem('landfall.settings')) || {}).theme;
    if (pref === 'light') mode = 'light';
    else if (pref === 'auto' && window.matchMedia
             && window.matchMedia('(prefers-color-scheme: light)').matches) mode = 'light';
  } catch (e) { /* storage unavailable — dark is the floor */ }
  document.documentElement.dataset.theme = mode;
  document.documentElement.style.colorScheme = mode;
  if (mode === 'light') {
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', '#C2C6CA');
  }
})();
</script>
</head>
<body>

<!-- ==> THE BOOT SCREEN. FIRST ELEMENT IN THE BODY, ON PURPOSE. <==
     Static markup with an inline SVG mark: no module has to load, no image has
     to be fetched, so it paints on the first frame instead of after the globe's
     scripts. That is the entire reason it exists — a boot screen that waits for
     JavaScript is just a slower blank page.

     IT ALSO GIVES THE BROWSER SOMETHING TO MEASURE. A WebGL canvas is not a
     candidate for "largest contentful paint", and above the fold this app was
     nothing but canvas — which is why `lcp_ms` came back zero on every session
     and we stopped chasing it (SPEC-OPS §17). This mark is a real element, so
     the number becomes real too.

     THE MARK IS HAND-KEPT IN SYNC. It now exists in three places: the PNG
     master under assets/source, the canvas drawing in map/glyph.js, and here.
     There is no build step to derive one from another (§2), so redrawing the
     logo means editing three things. Stated rather than discovered later. -->
<div id="boot" role="status" aria-live="polite">
  <div id="boot-mark" aria-hidden="true">
    <!-- THE REAL LANDFALL MARK. The four-arm spiral from assets/icons/, inlined.

         being on glass before any module runs; an external file is one more
         request between the user and the first thing they see. 3.3 KB of markup
         costs less than a round trip.

         THE HEX IS ALLOWED HERE AND NOWHERE ELSE. §Design says zero hardcoded
         hex in feature code. This is artwork, not feature code — the same
         exemption Saffir-Simpson category colors get: the mark is a fixed
         contract that must look identical everywhere, so it carries its own
         palette rather than reading tokens.

         THE ONE EXCEPTION IS THE PLATE. The first group is a full-bleed
         512x512 rectangle with the arms punched out of it — the maskable
         icon's background, which is what makes the dark arms dark. Left at its
         exported #070D18 it matches --ocean on the dark theme by coincidence
         and paints a BLACK SQUARE on the light one, where --ocean is #C2C6CA.
         So that one fill reads the token. Inline SVG inherits CSS custom
         properties, so it tracks the theme with no JS.

         Stripped on the way in: eight duplicate stroke-only groups at 0.3px,
         an export artifact from the drawing tool. Invisible at 88px, 4.3 KB of
         bytes on the first-paint path. The source file in assets/icons/ is
         untouched and remains the master. -->
    <!-- ==> DEFINED ONCE, USED TWICE. <== The mark used to be written out in
         full right here, and the storm pill's spinner would have made it a
         FOURTH hand-kept copy (after the PNG master, map/glyph.js's canvas
         drawing, and this). A <symbol> is the no-build-step way to have one
         copy: the geometry lives here, and anything that wants the mark points
         at it with <use href="#mark-spiral">. Redrawing the logo is now two
         files, not four — and the two that remain are genuinely different
         things (flat artwork vs. a drawing projected onto a curved globe),
         which cannot be shared however hard you try. -->
    <svg viewBox="0 0 512 512" aria-hidden="true"><use href="#mark-spiral"/></svg>
  </div>
  <p id="boot-name">Landfall</p>
  <p id="boot-note" data-visible="false"></p>
</div>

  <!-- ONE BUTTON, TWO JOBS, AND THE ICON SAYS WHICH ONE YOU GET.

       Off north (the globe has been two-finger-rotated or drag-rotated), it is
       a COMPASS: the needle rotates every frame to keep pointing at true north
       on screen, and tapping it turns the globe back upright. At north it
       becomes the CROSSHAIR: tapping it flies all the way back out to space,
       centred on your home if you have set one and on the United States if you
       have not, and drops any storm selection.

       Why one control rather than two: they are the same request phrased at
       two scales — "put the view back". A dedicated compass that vanishes at
       north leaves a hole in the cluster and shifts every button under it,
       and a permanent compass at north is a control that visibly does nothing.
       Morphing keeps the cluster's geometry fixed and always offers the more
       useful of the two actions. It sits at the TOP because it is the way out
       of wherever you are, and the four things below it are places to go.

       Both marks live in the button at once and cross-fade with opacity; the
       needle's inner <g> is the only thing rotated per frame (main.js). -->

          data-mode="recenter" aria-label="Recenter the globe">

       Both answer "put me back somewhere I know" — one to the whole globe,
       one to the place Aaron actually lives — so they read as a pair and the
       two "browse" controls (storms, layers) sit below them as a second pair.
       It used to sit fourth, between Layers and Settings, where it was just

       home-screen icons and the boot splash are cut from, so it is identity
       rather than an instruction and reads as the odd one out on purpose. It
       replaced a hand-drawn two-arm spiral.

       does not fill. Scaling the source beats retracing it at 24 px, where the
       arms would have to be redrawn by eye and would then be a SECOND version

<!-- Local, not unpkg — SPEC §17 A3. The version lives in the FILENAME so a
     bump is a visible one-line change here and the old file can be deleted
     in the same commit; nothing silently upgrades underneath us.

     ===> `defer` IS LOAD-BEARING. IT IS NOT A TIDY-UP. <===
     These two files are 1.5 MB. Measured with tools/load-probe.mjs on a
     4x-throttled phone, downloading + compiling + running them costs 1.69
     SECONDS, and without `defer` a classic script does that work where it
     sits — blocking the parser, and with it the boot screen's own paint.

     `defer` says "parse me later, in document order, before
     DOMContentLoaded". Order is preserved, so MapLibre still runs before
     Three, and both still run before main.js: module scripts are deferred by
     default and these now sit in the same queue, ahead of them in document
     order. Nothing below depends on either global at parse time — the last
     inline script in this file is the pre-paint theme resolver near the top,
     which touches neither.

     Measured effect: module staircase 1682ms -> 1046ms, first paint
     unchanged. Compare with `<link rel="modulepreload">`, which was measured
     on the same rig and REJECTED: it halved the staircase but pushed first
     paint 432ms -> 628ms, because the hints compete with the boot screen for
     the same connection. Loading sooner while FEELING slower is the wrong
     trade under §Perf, and it is why the preload list this pass was scoped to
     add does not exist. -->
<script defer src="./vendor/maplibre-gl-5.6.0.js"></script>
<!-- No pmtiles library here anymore: the R2 basemap is served as ordinary
     tile URLs by the Pages Function tile proxy (functions/tiles/). The
     .pmtiles format is read server-side only. -->
<script defer src="./vendor/three-0.128.0.min.js"></script>
<!-- REPLAY. Inert unless the URL says ?replay=ida, and it must stay inert:
     the shipping app is byte-identical without that flag. It loads BEFORE
     main.js because module scripts run in document order, and it has to point
     the relay at the archive and move the clock before the app starts asking
     either of them anything. See replay/boot.js. -->
<script type="module" src="./replay/boot.js"></script>
<!-- Milton's published surge, on the real layer. Inert without ?surge=milton. -->
<script type="module" src="./surge/boot.js"></script>
<script type="module" src="./main.js"></script>
<script type="module" src="./pwa.js"></script>
