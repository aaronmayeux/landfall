<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>drawer head harness</title>
<!--
  drawer-head-harness.html — the real drawer, two fake views, one real stepper.

  ==> IT EXISTS TO MEASURE PIXELS, WHICH IS THE ONLY WAY THESE CLAIMS CAN BE
  CHECKED. <== The header is a three-column grid whose whole promise is that
  the middle column lands on the true centre no matter how wide the lead slot
  is. That is a layout fact. So is the distance between the Back chevron and
  the stepper's prev chevron, which is the entire reason this pass happened.

  The app itself cannot be used: the sandbox reaches no storm feed, so it boots
  to an empty ocean with no storm to title a drawer with and no second storm to
  step to.

  IT IS A TEST FIXTURE AND NOT PART OF THE APP. Nothing links here and the
  service worker never caches it.
-->
<link rel="stylesheet" href="../ui/panels.css">
<!--
  ==> BOTH STYLESHEETS, BECAUSE THE DASHBOARD'S CHIP IS DEFINED IN THE OTHER
  ONE. <== The first cut of this harness loaded only panels.css, so
  the chip rendered as bare inline text: no padding, no border, no
  `margin-left: auto`. Every box that causes the two bugs this file is here to
  catch simply did not exist, and both assertions passed against a control that
  was never built. A fixture that omits a stylesheet the real app loads is a
  fixture that tests a different app. (The chip itself now lives in panels.css
  as `.drawer-chip`, since both drawers render it — but `.home-threat` and the
  rest of the dashboard's rules are still home.css's, so both sheets stay.)
-->
<link rel="stylesheet" href="../ui/home.css">
<style>
  /*
    ==> THESE ARE index.html's TOKENS AND THEY HAVE TO STAY index.html's TOKENS.
    <== Every number this fixture reports is a distance measured in these units,
    so a token that drifts from the app turns every pixel assertion into a
    measurement of a different app that quietly still passes. This block was
    exactly that for two commits: 6/10/14/20 spacing against the app's 4/8/12/16,
    a 8px radius against 10, a 12px glow against 8. drawer-head-check.mjs now
    reads index.html's `:root` and fails if any of these disagrees, because a
    comment asking the next person to keep them in sync is not a guard.
  */
  :root {
    --touch-target: 44px;
    --space-tight: 4px;
    --space-snug: 8px;
    --space-base: 12px;
    --space-comfy: 16px;
    --radius: 10px;
    --radius-large: 16px;
    --glass: #101722;
    --glass-blur: 0px;
    --glass-border: rgba(120, 190, 225, 0.16);
    --glass-shadow: rgba(0, 0, 0, 0.55);
    --text-primary: #E8F1F8;
    --text-secondary: #9DB3C7;
    --text-muted: #7089A5;
    --font-numeric: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    /*
      THE TYPE SCALE AND THE DRAWER FRAME. Every distance this fixture reports
      is measured in these, so they are index.html's values and the check above
      fails if any of them drifts — see the note at the top of this block. The
      header's pinned height in particular is the whole reason the close button
      and the title land on one line whichever drawer is open, and a fixture
      that did not declare it would measure a header that resizes itself.
    */
    --type-hero: 1.6rem;
    --type-xl: 1.25rem;
    --type-title: 1.05rem;
    --type-lead: 0.95rem;
    --type-body: 0.875rem;
    --type-small: 0.78rem;
    --type-micro: 0.6875rem;
    --identity-sub-h: 1.7rem;
    --drawer-head-h: calc(var(--identity-sub-h) + 1.3rem
                          + var(--space-snug) + var(--space-tight));
    --drawer-body-pad: var(--space-snug);
    --drawer-inset: var(--space-comfy);
    --focus-ring: #5FE0F5;
    --focus-ring-width: 2px;
    --dot-glow-blur: 8px;
    --scroll-fade: 12px;
    /* Fixture-only: the app animates, the harness measures still frames. */
    --duration-base: 0s;
    --duration-instant: 0s;
    --ease-settle: linear;
    --ease-swap: linear;
    --safe-bottom: 0px;
    --safe-top: 0px;
    --keyboard-inset: 0px;
  }
  body { margin: 0; background: #05080d; }
</style>
</head>
<body>
<aside id="drawer" data-open="false" aria-label="Panel"></aside>

<script type="module">
import { createDrawer } from '../ui/drawer.js';
import { createStormStepper } from '../ui/storm-stepper.js';

const storms = Array.from({ length: 7 }, (_, k) => ({
  id: `test:${k + 1}`,
  name: `Storm ${k + 1}`,
}));
let currentStorm = storms[1];

/* ==> THE CHIP'S WIDTH IS A VARIABLE BECAUSE IT DECIDES WHETHER THE BUG CAN
 * APPEAR AT ALL. <== The identity block is as wide as its widest line. With the
 * default long chip and a short storm name, the CHIP is the widest thing, the
 * block is chip-width, and there is no free space for a stray auto margin to
 * take — so the header looks perfect and proves nothing. The offset Aaron saw
 * on glass needs the other pairing: a name longer than the chip. The first cut
 * of this fixture only ever had the first one. */
let chipText = 'NOT NEAR YOU';

const drawer = createDrawer({ root: document.getElementById('drawer') });

/**
 * ==> EVERY ENTRY, AND WHETHER THE DRAWER CALLED IT FRESH. <== `fresh` is the
 * only thing that tells a view "this is a new visit, not a return", and the
 * home dashboard forgets the storm you stepped to on the strength of it. It is
 * a fact about the CALL, invisible in markup and invisible in any measurement,
 * so the only place to observe it is a view that writes down what it was
 * handed. Every registered view below pushes here.
 */
const entered = [];
const record = (id) => (arg, opts) => entered.push({ id, fresh: opts?.fresh });

/**
 * A storm identity block, the same shape both real views supply.
 *
 * ==> A BUTTON, NOT A DIV, BECAUSE THE DASHBOARD'S REALLY IS ONE. <== It is the
 * only route from the dashboard into the storm's own panel, and
 * `button.drawer-identity` carries `width: 100%`, which is what gives the
 * second line free space to be mis-centred inside. A div fixture had no free
 * space and so could not reproduce the bug at all.
 *
 * ==> ONE DOT, BECAUSE THE APP NOW HAS ONE. <== This briefly gave each drawer
 * its own swatch class, mirroring an app where the dashboard used `.home-swatch`
 * and the detail panel borrowed `.row-swatch` — and that borrowing was itself
 * the bug: no glow, and 2.5px low (see ui/panels.css). Both views now render
 * `.drawer-identity-dot`, so the fixture renders that.
 */
/* ==> THE DASHBOARD'S IDENTITY IS A BUTTON AND THE DETAIL PANEL'S IS NOT, AND
 * THIS FIXTURE USED TO MAKE BOTH BUTTONS. <== In the app the dashboard's title
 * is the only route into the storm's own panel, so it is a `<button>`; the
 * detail panel's is a plain `<div>` because there is nowhere for it to go.
 * panels.css carries rules scoped to `button.drawer-identity` — the reset, the
 * hover underline, the focus ring — so a fixture that made both buttons was
 * styling the detail panel with the dashboard's rules and calling the result a
 * comparison. Caught 2026-08-20 by a deliberate break that could not fire:
 * with no element-type difference in the markup, no drawer-scoped override was
 * expressible, and the assertion meant to catch one could not have. */
function identity(storm, sub, { asButton = false } = {}) {
  const wrap = document.createElement(asButton ? 'button' : 'div');
  if (asButton) wrap.type = 'button';
  wrap.className = 'drawer-identity';
  wrap.innerHTML = `
    <div class="drawer-identity-line">
      <span class="drawer-identity-dot" style="--dot-ink: #3ec46d" aria-hidden="true"></span>
      <h1 class="drawer-title">${storm.name}</h1>
    </div>
    <div class="drawer-identity-sub">${sub}</div>`;
  return wrap;
}

/* --- a plain root view, titled with a string (Storms / Layers) ------------ */
drawer.register({
  id: 'storms',
  title: 'Storms',
  onEnter: record('storms'),
  mount(host) { host.innerHTML = '<div class="drawer-body"><p>list</p></div>'; },
});

/* --- the home dashboard's shape: storm title, "Home" eyebrow, stepper ----- */
const homeStepper = createStormStepper({
  siblings: () => storms,
  current: () => currentStorm,
  onStep: (s) => { currentStorm = s; homeStepper.render(); drawer.refreshChrome(); },
});
drawer.register({
  id: 'home',
  title: 'Home',
  /* ==> `.drawer-chip`, BECAUSE THAT IS WHAT ui/view-home.js EMITS. <== It was
   * `.home-chip` until 2026-08-20, when the chip was extracted to panels.css so
   * the detail panel could render the same one. A fixture naming the old class
   * would measure an unstyled span — the same class of fault as the missing
   * stylesheet noted at the top of this file, and one that already happened
   * here once. */
  titleFor: () => identity(currentStorm, `<span class="drawer-chip">${chipText}</span>`, { asButton: true }),
  eyebrow: () => 'Home',
  onEnter: record('home'),
  mount(host) {
    host.innerHTML = '<div class="drawer-body"><p>dashboard</p></div>';
    host.prepend(homeStepper.el);
    homeStepper.render();
  },
});

/* --- the detail panel's shape: storm title, labelled back, stepper -------- */
const detailStepper = createStormStepper({
  siblings: () => storms,
  current: () => currentStorm,
  onStep: (s) => { currentStorm = s; detailStepper.render(); drawer.refreshChrome(); },
});
drawer.register({
  id: 'detail',
  title: 'Storm',
  /* The detail panel wears the SAME chip as of 2026-08-20; it was bare text. */
  titleFor: () => identity(currentStorm, '<span class="drawer-chip">Tropical Storm</span>'),
  onEnter: record('detail'),
  mount(host) {
    host.innerHTML =
      '<div class="detail-stamp">Advisory 001</div><div class="drawer-body detail-body"><p>body</p></div>';
    host.prepend(detailStepper.el);
    detailStepper.render();
  },
});

/**
 * ==> SCOPED TO THE ACTIVE VIEW, AND THAT IS NOT A DETAIL. <== Every registered
 * view keeps its host in the DOM — `hidden`, not destroyed — so BOTH steppers
 * exist at all times and a bare `document.querySelector('.storm-step-arrow')`
 * returns whichever was registered first, inside a hidden host, whose rect is
 * 0x0 at the origin. The first cut of this harness did exactly that, and the
 * separation assertions passed against a phantom control sitting at (0,0)
 * instead of the real one. A measurement of the wrong element is worse than no
 * measurement, because it reads as proof.
 */
const box = (sel, { inView = false } = {}) => {
  const root = inView
    ? document.querySelector('.drawer-view[data-active="true"]')
    : document;
  const el = root?.querySelector(sel);
  if (!el || el.hidden) return null;
  const r = el.getBoundingClientRect();
  if (!r.width && !r.height) return null; // in the DOM but not laid out
  return { left: r.left, right: r.right, top: r.top, bottom: r.bottom, w: r.width, h: r.height };
};

window.__harness = {
  drawer,

  /** Go to a root view. */
  go(id) { drawer.go(id); },
  /** Push a view on top of the current one, so Back appears. */
  push(id) { drawer.push(id); },
  /** Pop one level, the way the header's Back chevron does. */
  back() { drawer.back(); },

  /** Every onEnter since the last reset, in order, with its `fresh` flag. */
  entries() { return entered.slice(); },
  resetEntries() { entered.length = 0; },

  read() {
    const head = box('.drawer-head');
    const title = box('.drawer-title-slot');
    const back = box('.drawer-back');
    const close = box('.drawer-close');
    const eyebrow = box('.drawer-eyebrow');
    const prev = box('.storm-step-arrow[data-step="prev"]', { inView: true });
    const next = box('.storm-step-arrow[data-step="next"]', { inView: true });
    const line = box('.drawer-identity-line');
    const sub = box('.drawer-identity-sub');
    const sheet = box('#drawer');
    return {
      headW: head?.w ?? null,
      headH: head?.h ?? null,
      /** How far the title's centre sits from the header's centre, in px. */
      titleOffCentre:
        head && title
          ? (title.left + title.right) / 2 - (head.left + head.right) / 2
          : null,
      backVisible: !!back,
      backText: document.querySelector('.drawer-back-text')?.textContent ?? null,
      backLabel: document.querySelector('.drawer-back')?.getAttribute('aria-label') ?? null,
      eyebrowVisible: !!eyebrow,
      eyebrowText: document.querySelector('.drawer-eyebrow')?.textContent ?? null,
      /** Close pinned to the trailing edge: gap from its right to the header's. */
      closeInset: head && close ? head.right - close.right : null,
      stepperVisible: !!prev,
      /** THE COMPLAINT, AS A NUMBER. Straight-line distance from the Back
       *  chevron's centre to the prev chevron's centre, and from Close to
       *  next. Under the old edge-pinned layout these were pure vertical
       *  drops of roughly one row height. */
      backToPrev:
        back && prev
          ? Math.hypot(
              (back.left + back.right) / 2 - (prev.left + prev.right) / 2,
              (back.top + back.bottom) / 2 - (prev.top + prev.bottom) / 2
            )
          : null,
      closeToNext:
        close && next
          ? Math.hypot(
              (close.left + close.right) / 2 - (next.left + next.right) / 2,
              (close.top + close.bottom) / 2 - (next.top + next.bottom) / 2
            )
          : null,
      /** Horizontal separation alone — the axis the old layout had none of. */
      backToPrevX:
        back && prev ? Math.abs((back.left + back.right) / 2 - (prev.left + prev.right) / 2) : null,
      closeToNextX:
        close && next ? Math.abs((close.left + close.right) / 2 - (next.left + next.right) / 2) : null,
      /** Top of the sheet to the top of the storm's name. The number Aaron
       *  compared between the two drawers by eye. */
      nameInset: sheet && line ? line.top - sheet.top : null,
      /** The header's own padding, read rather than assumed. The asymmetry is a
       *  design claim (room above the name, tight below it because the stepper
       *  brings its own space), and a claim is worth a number. */
      headPadTop: (() => {
        const el = document.querySelector('.drawer-head');
        return el ? parseFloat(getComputedStyle(el).paddingTop) : null;
      })(),
      headPadBottom: (() => {
        const el = document.querySelector('.drawer-head');
        return el ? parseFloat(getComputedStyle(el).paddingBottom) : null;
      })(),

      /* ==> THE AXIS EVERYTHING ELSE IN THE PANEL USES. <== Aligning the chip
       * to the name is not enough on its own: the first cut of this did exactly
       * that and left the pair 9px right of the stepper directly beneath them,
       * the panel's edges and every section below (measured on glass, name at
       * 700 against a stepper at 672 on a 1344px screen). The name has to land
       * on the header's own centre, and then the chip under it, and then the
       * three of them agree with the rest of the panel rather than only with
       * each other. */
      /* ==> THE SPAN FROM THE DOT'S LEFT EDGE TO THE NAME'S RIGHT, NOT THE BOX
       * AROUND THEM. <== `.drawer-identity-line` is a full-width block inside
       * the identity block, so ITS centre is the block's centre whatever the
       * content inside it does — padding, margins, anything. A first cut of this
       * measured that box and passed against a layout with the line shifted a
       * whole dot-and-gap sideways. That is the third time in this file a
       * box-versus-box comparison has read 0.0 while the pixels were wrong; the
       * rule is that a measurement of a container proves nothing about what is
       * inside it. */
      lineVsHead: (() => {
        const d = box('.drawer-identity-dot');
        const n = box('.drawer-title');
        if (!head || !d || !n) return null;
        return (d.left + n.right) / 2 - (head.left + head.right) / 2;
      })(),

      /* ==> THE DOT IS A LIGHT, AND A DEAD ONE LOOKS LIKE A STYLING CHOICE. <==
       * The detail panel shipped a flat disc because it borrowed a swatch whose
       * glow is composed from a custom property this block never set: an invalid
       * `var()` makes the whole `box-shadow` compute to `none`, in silence. */
      dotShadow: (() => {
        const d = document.querySelector('.drawer-identity-dot');
        return d ? getComputedStyle(d).boxShadow : null;
      })(),

      /** How far the dot's centre sits below the name's — the `margin-top: 5px`
       *  the storm list's row needs and this header does not. */
      dotVsNameY: (() => {
        const d = box('.drawer-identity-dot');
        const n = box('.drawer-title');
        if (!d || !n) return null;
        return (d.top + d.bottom) / 2 - (n.top + n.bottom) / 2;
      })(),

      /** The row immediately below, which was already on that axis and is what
       *  made the drift visible to the eye. */
      stepperVsHead: (() => {
        const label = document.querySelector(
          '.drawer-view[data-active="true"] .storm-step-count'
        );
        if (!head || !label) return null;
        const r = label.getBoundingClientRect();
        if (!r.width) return null;
        return (r.left + r.right) / 2 - (head.left + head.right) / 2;
      })(),

      /* ==> MEASURE THE INK, NOT THE BOXES. <== This used to compare the centre
       * of `.drawer-identity-sub` against the centre of `.drawer-identity-line`.
       * Both are full-width block boxes inside the same parent, so their centres
       * are IDENTICAL BY CONSTRUCTION — the number was 0.0 whatever the second
       * line did, and two assertions rode on it while that line sat visibly off
       * to one side. An assertion that cannot go red is worse than none, because
       * it reads as proof.
       *
       * There was a `chipVsHead` beside this one, measuring the dashboard pill's
       * own box. The pill is gone (2026-08-20) and both drawers' second lines
       * are now bare text, so ONE probe covers both — a Range around the
       * contents gives the ink's extent whichever drawer is showing. */
      subInkVsHead: (() => {
        const subEl = document.querySelector('.drawer-identity-sub');
        if (!subEl || !head || !subEl.textContent.trim()) return null;
        const range = document.createRange();
        range.selectNodeContents(subEl);
        const r = range.getBoundingClientRect();
        if (!r.width) return null;
        return (r.left + r.right) / 2 - (head.left + head.right) / 2;
      })(),

      /** ==> THE CHIP'S COMPUTED LOOK, SO "BOTH DRAWERS RENDER THE SAME CHIP"
       *  IS A MEASUREMENT RATHER THAN A CLAIM. <== The whole reason
       *  `.drawer-chip` was lifted out of home.css is that two drawers now
       *  render it, and the failure this guards is the ordinary one: somebody
       *  needs the detail panel's chip a little different, adds a scoped
       *  override, and the two quietly stop matching. Serialised as a string so
       *  the assertion is one comparison and the readout names what differs. */
      chipStyle: (() => {
        const chip = document.querySelector('.drawer-identity-sub .drawer-chip');
        if (!chip) return null;
        const c = getComputedStyle(chip);
        return [
          c.fontSize, c.fontWeight, c.letterSpacing, c.textTransform,
          c.padding, c.borderRadius, c.border, c.color, c.whiteSpace,
        ].join(' | ');
      })(),

      /** Kept so the line's own geometry stays visible in the readout. */
      lineW: line?.w ?? null,
      subH: sub?.h ?? null,
      sheetH: sheet?.h ?? null,
      prevW: prev?.w ?? null,
      prevH: prev?.h ?? null,
      nextW: next?.w ?? null,
      nextH: next?.h ?? null,
    };
  },

  /** Swap the dashboard's storm for one whose body would be a different
   *  height — the far layout drops the chart and the countdown. */
  useShortBody() {
    document.querySelector('.drawer-view[data-active="true"] .drawer-body').innerHTML =
      '<p>one line</p>';
  },
  useLongBody() {
    document.querySelector('.drawer-view[data-active="true"] .drawer-body').innerHTML =
      Array.from({ length: 60 }, () => '<p>a line of dashboard content</p>').join('');
  },

  /** Long name, to prove the centre column truncates rather than shoving. */
  useLongName() {
    currentStorm = { id: 'test:long', name: 'HURRICANE BARTHOLOMEW-26' };
    drawer.refreshChrome();
  },
  useShortName() {
    currentStorm = storms[1];
    drawer.refreshChrome();
  },

  /** ==> THE PAIRING THAT LETS THE BUG EXIST. <== A name wider than the chip
   *  means the identity block is name-width and the second line has free space
   *  in it. That is the only arrangement in which a stray auto margin has
   *  anywhere to push the chip to, and it is the one the live app was in. */
  useWideNameNarrowChip() {
    currentStorm = { id: 'test:long', name: 'HURRICANE BARTHOLOMEW-26' };
    chipText = 'NEAR';
    drawer.refreshChrome();
  },
  useDefaultChip() {
    chipText = 'NOT NEAR YOU';
    drawer.refreshChrome();
  },
};
</script>
</body>
</html>
