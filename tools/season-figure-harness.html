<!doctype html>
<html lang="en" data-theme="sepia">
<head>
<meta charset="utf-8">
<title>the merged figure row — geometry harness</title>
<!--
  ==> NO FIXTURE TOKENS AND NO FIXTURE MARKUP. <== The same rule
  `tools/seasons-row-harness.html` states and for the same reason:
  `tools/drawer-head-harness.html` copied its token values and drifted from the
  app for two commits under a comment asking it not to. This page loads the
  SHIPPED stylesheets and builds its rows with the SHIPPED renderers, off a
  real storm and the real rankings file.
-->
<link rel="stylesheet" href="/ui/panels.css">
<!--
  ==> `ui/home.css` IS LOADED BECAUSE THE APP LOADS IT, AND LEAVING IT OUT MADE
  THIS PAGE LIE. <== §57.60g. It is where `.visually-hidden` is declared, and
  the numbered landfall row emits one. Without the rule that span is an in-flow
  grid item rather than an out-of-flow one, so it took the badge's column and
  pushed the whole row a column right — a layout fault that exists only on this
  page. A harness missing a stylesheet the app has reports faults the app does
  not have and hides ones it does. The order here is index.html's order.
-->
<link rel="stylesheet" href="/ui/home.css">
<link rel="stylesheet" href="/seasons/seasons.css">
<style>
  /* The drawer box the panel lives inside, and nothing else. */
  html, body { margin: 0; background: #1C1409; }
  #drawer { width: 100%; }
</style>
</head>
<body>
<div id="drawer"><div class="drawer-body" id="body"></div></div>
<script type="module" src="/tools/season-figure-harness.js"></script>
</body>
