<title>Landfall — coast probe</title>

<!--
  coast-probe.html — WHAT DOES THE BASEMAP ACTUALLY HAND BACK?

  ==> THIS EXISTS BECAUSE TWO SHORELINE CUTS SHIPPED AND BOTH FAILED ON GLASS,
  AND BOTH FAILED BY REASONING ABOUT WHAT THIS DATA PROBABLY IS. <== It answers
  the questions a GPU mask has to be built against, by reading the bytes:
  which schema is live, ring count, point spacing, whether rings are closed,
  which way they wind, how far tile buffers reach, and how many points arrive
  twice from overlapping tiles.

  ==> THE LOGIC IS IN `coast-probe.js` AND THAT IS NOT A STYLE CHOICE. <== The
  site's CSP is ENFORCED and `script-src` carries no 'unsafe-inline'. An inline
  module here would be blocked outright and this page would render as buttons
  that do nothing — a silent failure, on the one tool whose whole job is to stop
  people guessing. Same reason `_headers` pins the one permitted inline script
  by hash instead of opening the category.

  DESKTOP IS FINE FOR THIS ONE. It measures what the tile decoder returns, which
  is identical everywhere. The water still has to be judged on a phone.

  Open from the deployed site or any static server:
    https://landfall.getgravitate.app/tools/coast-probe.html
-->
