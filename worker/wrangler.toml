#
# wrangler.toml — the Landfall warm Worker. SPEC §17 Pass B.
#
# THIS IS A SECOND, SEPARATE DEPLOY. It is not part of the Pages project and
# pushing to main does NOT deploy it through the Pages pipeline — it deploys
# through Workers Builds, configured once in the dashboard with this folder
# (`worker/`) as the root directory. SPEC §17 Pass B carries the setup steps.
#
# The reason it exists as its own Worker: Cron Triggers are supported on
# Workers and UNSUPPORTED on Pages (measured against Cloudflare's own
# Pages-to-Workers migration guide, 2026-07-25), and migrating a Pages project
# that currently works, in order to get a scheduler, is a risk with no upside.
#
# It is also the reason the app cannot be taken down by anything in here. A
# broken build in this folder fails THIS Worker's deploy and nothing else —
# unlike the Analytics Engine binding that failed every `/api/` route at once
# because Pages Functions publish as a single Worker (§17). If this Worker is
# down, missing, or was never deployed at all, every relay route falls back to
# fetching upstream exactly as it did before Pass B.
#

name = "landfall-warm"
main = "src/index.js"
compatibility_date = "2026-07-25"

# BOTH OF THESE WERE WARNINGS ON THE FIRST DEPLOY, LEFT AT THEIR DEFAULTS.
# Stated explicitly now, because a default nobody chose is a setting nobody can
# argue with later.
#
# workers.dev URL: KEPT ON. It is how the manual `GET /warm?key=…` trigger is
# reached, which is the difference between checking a change in ten seconds and
# deploying then waiting five minutes to read a log. The URL is safe to expose
# because the fetch handler FAILS CLOSED — 404 for every path, and 404 rather
# than 403 for a wrong key, so it does not even advertise that something is
# there (the same posture functions/api/_inspect-guard.js settled on).
workers_dev = true

# Preview URLs: OFF. They mint a NEW public hostname per uploaded version, and
# this Worker has exactly one reason to be reachable from the internet. Every
# extra public hostname on a thing holding a cache-bypass key is surface bought
# for nothing. Non-production branches still upload versions; they just do not
# each get their own address.
preview_urls = false

# Five minutes. The cron cadence must be at least as fast as the freshest thing
# it warms, or that entry ages out of its own window before the next cycle
# refreshes it and every route falls through to upstream — the warm store would
# be paid for and bypassed.
#
# THE JUSTIFICATION USED TO NAME THE TWO STORM LISTS AT 5 MINUTES. Both have
# been 30 since 2026-08-01. The shortest FRESH window now warmed is 15 minutes
# (advisories, a-decks, the genesis outlook), so this is three times faster than
# it strictly needs to be — kept, because the margin is what stops a slow cycle
# from opening the gap this comment describes, and because at ~288 invocations
# a day the cost of the margin is nothing.
#
# It is NOT tied to the client's 30-minute poll (POLL.storms). The client's
# cadence decides how often a phone asks; this decides how current the answer
# is when it does.
[triggers]
crons = ["*/5 * * * *"]

# Persisted logs, 7-day retention. THE CRON IS WHY THIS IS ON.
#
# `console.log` already reaches the real-time stream with no configuration, but
# real-time only shows what happens while somebody is watching the page — and
# this Worker's whole job runs unattended every five minutes. The one cycle
# worth reading is always the one that already went past. Persisted logs turn
# "sit and wait for a tick" into "look at what happened".
#
# ==> IT IS SET HERE AND NOT WITH THE DASHBOARD TOGGLE, WHICH ALSO EXISTS. <==
# Workers Builds deploys this Worker by applying THIS FILE. A setting absent
# here is reset to its default on the next deploy, so the dashboard toggle
# survives until the next `git push` and then silently switches itself off —
# with the logs you would use to notice being the thing that vanished. Every
# other setting this Worker has (name, cron, KV binding) already lives in this
# file; config in two places drifts, and this is the copy that deploys.
#
# Volume is ~288 invocations/day and a single log line each, which is nothing
# against the paid plan's included allowance. `head_sampling_rate = 1` keeps
# every one of them: at this volume sampling would only ever hide the failure
# that mattered.
[observability]
enabled = true
head_sampling_rate = 1

# The store. THE SAME NAMESPACE MUST BE BOUND IN THE PAGES PROJECT UNDER THIS
# EXACT NAME — `LANDFALL_CACHE`, matching KV_BINDING in
# functions/api/_kv-cache.js. A binding name typo does not throw anywhere: the
# reader sees `undefined`, returns null forever, and every route quietly falls
# through to upstream. The whole pass would deploy successfully and do nothing.
#
# The namespace was created in the dashboard 2026-07-25. The id is not a
# secret — it is a resource identifier, visible in the dashboard URL, and it
# grants nothing on its own: reaching this namespace requires an API token on
# the account. Safe in the repo, unlike MAPBOX_TOKEN or WARM_KEY, which are
# credentials and live in Cloudflare only.
[[kv_namespaces]]
binding = "LANDFALL_CACHE"
id = "475d63351ed1461f8e32b0751297f9b2"

# Where the Worker fetches its own relay routes from. It warms by calling OUR
# OWN `/api/` endpoints rather than NOAA/GDACS/JTWC directly, so that every
# parse has exactly one implementation and what lands in KV is byte-identical
# to what the route would have served (worker/src/sources.js explains it fully).
[vars]
SITE_ORIGIN = "https://landfall.getgravitate.app"

# WARM_KEY is a SECRET, not a var — it is set with
# `npx wrangler secret put WARM_KEY` and it is deliberately absent from this
# file. It does two things:
#   1. lets the Worker's requests bypass the routes' colo and KV caches, which
#      is the only way a warm cycle actually reaches the source;
#   2. gates the manual `GET /warm?key=...` trigger.
# The SAME value must be set as an environment variable in the Pages project,
# or the routes will not honour the bypass header and the warm loop will spend
# every cycle re-confirming its own previous answer.
#
# Fails closed everywhere: no key means no bypass and no manual trigger. An
# ungated cache bypass would be a lever any stranger could pull to drive
# uncached traffic through us at NOAA — the open-proxy problem §17 A2 closed on
# the inspect routes, reopened on the feeds themselves.
