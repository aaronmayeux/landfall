# ci.yml — the checks that must be true before code is trusted.
#
# WHY THIS EXISTS AND NOT JUST THE PRE-PUSH HOOK
# The hook lives in .git/hooks, which is per-clone and disappears with the
# sandbox. It also cannot run the browser suites: the cloud sandbox reaches
# GitHub and npm and nothing else, so anything wanting tiles.openfreemap.org
# hangs there. A runner has open internet. This is where those checks live.
#
# Two jobs, and both must be green:
#   verify   parses every module and runs the zero-dependency suites. No
#            browser, no network beyond the checkout.
#   browser  installs a real chromium and runs everything that needs one,
#            including the checks that want tiles.openfreemap.org.
#
# THERE IS NO `known-broken` JOB ANY MORE, and that is the point. It existed
# to hold checks that were already failing, so they stayed visible instead of
# quietly rotting — with the standing rule that a permanently red check trains
# you to ignore the whole board. Everything it held has been fixed and
# promoted. If something starts failing and cannot be fixed the same day, do
# not reintroduce a holding pen by reflex: the pen was only ever honest
# because it came with a written reason and an exit condition.

name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # A SyntaxError in an ES module means the module never parses and nothing
      # runs at all — a blank screen, not a broken feature. `node --check` does
      # NOT catch this on a .js file; check-syntax.mjs exists because of an
      # outage on 2026-07-23. First gate, every time.
      - name: every module parses
        run: node tools/check-syntax.mjs

      # Section numbers are permanent addresses that code comments reference.
      # If a heading moved and the index was not regenerated, every session
      # after this one is navigating with a wrong map.
      - name: spec index is current
        run: node tools/spec-index.mjs --check

      # The spec claims to describe the app as it is RIGHT NOW. Nothing enforced
      # that, and on 2026-08-11 a full audit found 32 mismatches — a ceiling
      # table wrong on every row, a routes table listing 7 of 24, and a
      # paragraph presenting a DELETED function as as-built. All countable, so
      # count them on every push instead of rediscovering them in six months.
      - name: documentation matches the code
        run: node tools/doc-check.mjs

      # A class in the markup with no rule in the stylesheet is SILENT: the
      # browser falls back to its own defaults and the panel just looks wrong.
      # `ui/view-area-detail.js` shipped that way — every class it emitted
      # resolved to nothing, the swatch did not appear at all, and forty test
      # suites plus check-syntax all passed. Nothing could have caught it,
      # because nothing was comparing the two halves. Now something is.
      - name: markup and stylesheets agree
        run: node tools/css-orphan-check.mjs

      # A selector a CHECK queries is a contract with the markup exactly as a
      # stylesheet rule is, and nothing was watching that side. On 2026-08-14
      # the home setup screen was rebuilt, `.home-drop` stopped existing, and
      # headless-check went on asking for it — so it crashed on its own null in
      # this job minutes after the push. That failure reads IDENTICALLY whether
      # the app regressed or was merely rearranged, which sends every reader
      # hunting a bug that is not there. A sweep found four more.
      #
      # It runs in `verify` and not `browser` on purpose: it is a text scan and
      # needs no chromium, so it fails in ninety seconds instead of after a
      # browser install. The gates that USE these selectors are in `browser`.
      - name: every selector still names something
        run: node tools/selector-contract-check.mjs

      # ==> TYPE DRIFT IS INVISIBLE ONE COMMIT AT A TIME AND OBVIOUS ON GLASS.
      # <== The drawers accumulated TWENTY-FIVE distinct font sizes, none of
      # them a decision — each was a number typed while writing one component
      # and never held against the one beside it. Two sizes 2% apart do not
      # read as a hierarchy, they read as a different TYPEFACE, which is
      # exactly how it was reported: "three or four different fonts", in an app
      # that has only ever loaded two. The pressure that produced them (a box
      # that needs to look right, right now) will exist again next week, so
      # this is a check and not a comment at the top of the stylesheet.
      - name: every size is on the type scale
        run: node tools/type-scale-check.mjs

      # Its sibling. type-scale-check holds the SIZES to a scale; this holds the
      # PAIRINGS to a meaning. Eighteen distinct size+colour combinations were
      # in use across the three stylesheets, and headings were muted while the
      # prose under them was primary -- so on every panel the least important
      # line was the brightest. Six roles now, and a selector in the contract
      # must resolve to its role's size and colour after the whole cascade.
      - name: every drawer selector holds its text role
        run: node tools/text-role-check.mjs

      # config/constants.js is 63 blocks in one file, deliberately (§12.1 — the
      # split was measured and declined). The generated table of contents at its
      # head is the only map of it, and a map missing the newest thing is worse
      # than no map. This fires only when a block is added, removed or renamed
      # without landing in a group — never on an ordinary comment edit.
      - name: constants table of contents is current
        run: node tools/constants-toc.mjs --check

      # Every color and spacing literal in feature code has to resolve to a
      # real token. Moved out of known-broken on 2026-08-08: its only failures
      # were in the volcano plume files, which no longer exist. It is blocking
      # now, which is the point — a green check that can go red is a check.
      - name: token-check
        run: node tools/token-check.mjs

      # No credential belongs in a tracked file. The push credential is a
      # fine-grained PAT with write access to this repo; leaking it into a
      # public repo is the one mistake here that cannot be undone by a revert.
      - name: no credentials in tracked files
        run: |
          if git grep -I -n -E 'github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{20,}' -- . ; then
            echo "::error::A credential is committed. Revoke it on GitHub NOW, then remove it."
            exit 1
          fi
          echo "clean"

      # Plain node, no dependencies, no browser. 62 suites, discovered by glob
      # — a new tools/test-*.mjs is picked up here with no edit to this file.
      # test-lifecycle is slow on purpose (real timer behaviour, ~65s) — do not
      # "optimise" it out.
      - name: zero-dependency suites
        run: |
          fail=0
          for f in tools/test-*.mjs; do
            printf '\n=== %s ===\n' "$f"
            if ! node "$f"; then
              echo "::error file=$f::suite failed"
              fail=1
            fi
          done
          for f in tools/contrast-check.mjs tools/csp-hash-check.mjs; do
            printf '\n=== %s ===\n' "$f"
            if ! node "$f"; then
              echo "::error file=$f::check failed"
              fail=1
            fi
          done
          exit $fail

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # On a runner we install the browser for real. Do NOT copy this into a
      # sandbox session: browser downloads are blocked there by design, and the
      # sandbox's own chromium is build 1194, which only playwright 1.56.0
      # speaks to. Here there is no such constraint.
      - name: install playwright chromium
        run: |
          npm i --no-audit --no-fund playwright@1.56.0
          npx playwright install --with-deps chromium

      # The suites load the app over http, not file://. Same port the
      # bootstrap script uses locally so the tools need no branching.
      - name: serve the app on 127.0.0.1:8099
        run: |
          python3 -m http.server 8099 --bind 127.0.0.1 >/tmp/server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8099/README.md >/dev/null && break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:8099/README.md

      # csp-check is designed to run offline and passes in the sandbox too.
      # privacy-check asserts the app talks to nobody it should not.
      - name: csp-check
        run: node tools/csp-check.mjs

      - name: privacy-check
        run: node tools/privacy-check.mjs

      # ==> A LAYOUT CHECK, AND IT HAS TO BE ONE. <== Both facts it asserts are
      # about pixels and neither is visible in a string of HTML: that entering
      # a view resets its scroll (setting scrollTop on an element that cannot
      # scroll is a silent no-op — the first cut of that fix targeted the wrong
      # element and would have passed any markup assertion), and that the
      # drawer body's top padding matches the fade mask exactly, so the first
      # line of content is neither ghosted nor pushed down by dead space.
      - name: drawer-scroll-check
        run: node tools/drawer-scroll-check.mjs

      # ==> ALSO PIXELS, AND ALSO INVISIBLE TO A STRING. <== The strength
      # strip's three figures have to sit in a row to be a comparison at all.
      # They were three independent stacks in equal `1fr` tracks, so they only
      # lined up while every label happened to be one line long — and "When
      # it's closest" wrapped as soon as its column got tight, dropping that
      # column's figure below the two either side of it. Measured after the
      # fix, the old layout fails this check at 288, 308 AND 358px, so it was
      # misaligning on ordinary phones and not only on the narrow desktop rail
      # where it was first noticed. test-home.mjs can prove the right cells are
      # emitted; only a browser can see where they land.
      - name: home-figs-check
        run: node tools/home-figs-check.mjs

      # ==> PIXELS AGAIN, AND A REGRESSION THAT WOULD BE INVISIBLE TO A STRING
      # CHECK. <== The setup screen's three ways to set a home have to be
      # PEERS, and the whole of that fact is computed style: identical
      # background, border and radius across all three, and a Remove-home
      # control that shares none of them. Both halves shipped wrong once —
      # drop-a-pin was `background: transparent` while its two siblings were
      # filled, and the delete control carried the choice recipe and read as a
      # fourth way to set a home. It also asserts that `focus()` nominates a
      # button rather than the search field, which is what stopped a phone
      # throwing a keyboard over the panel on arrival. Every one of those
      # passes any markup assertion you could write.
      - name: home-setup-check
        run: node tools/home-setup-check.mjs

      # This needs the basemap, which the sandbox cannot reach. This runner is
      # the only place it can honestly run.
      - name: offline-check
        run: node tools/offline-check.mjs

      # ==> IT LIVES HERE NOW, AND THE `known-broken` JOB IS GONE. <==
      # It sat in a non-blocking job reporting 22 problems, every one of which
      # turned out to be the suite rather than the app:
      #
      #   * 18 were console errors from /api/ paths that do not exist on
      #     `python3 -m http.server`. The filter that was supposed to excuse
      #     them searched the MESSAGE TEXT for the URL, and Chrome does not put
      #     the URL in the text. It reads location() now, and cross-references
      #     the status code against which responses actually failed, so a 404
      #     from a real missing file is never forgiven.
      #   * the graticule assertion was stale; config/layers.js:495 says
      #     'Tropics & equator' and the check reads it from there.
      #   * the install control was never missing. `#set-install` is the READY
      #     shape only, and headless Chromium never fires the event that
      #     produces it. Both shapes are correct and both now pass.
      #
      # A fourth thing rode along: the zero-size focusable list named 32
      # controls every run because it read each element's own computed style
      # and could not see `display: none` on an ancestor — so it was listing
      # every control in every closed view. checkVisibility() walks ancestors.
      # It is a hard failure now, having printed clean.
      #
      # Verified green on this runner before promotion. A check nobody has
      # seen pass does not get to block a deploy.
      - name: headless-check
        run: node tools/headless-check.mjs
