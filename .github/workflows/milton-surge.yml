# milton-surge.yml — Hurricane Milton's published PEAK STORM SURGE, per advisory.
#
# ==> WHY MILTON AND NOT IDA. <==
# Ida has no peak storm surge product. NHC's peak-surge GIS archive begins in
# 2022; there is no 2021 in it at all. What Ida DID publish is the Potential
# Storm Surge Flooding Map (inundation) — a different product, at street
# resolution, with different classes. Building the app's surge layer against
# Ida would have meant building the wrong thing and then discovering it.
#
# The archive's 2022 files are named `ExperimentalPeakStormSurge`; everything
# from 2023 on is plain `PeakStormSurge`. That rename is the product going
# operational, and it is why a 2024 storm is exactly as current as a 2026 one.
#
# Milton (AL142024) has 22 advisories including intermediates — more than any
# other operational-era storm in the archive — and Tampa Bay is the most
# demanding surge coastline in it.
#
# ==> THIS IS SURGE ONLY. <== No track, no cone, no watch/warning, no wind
# radii. Aaron's call. Milton is a fixture for one layer, not a second replay
# storm, and this directory must not quietly grow into one.
#
# ==> WHAT THE FIRST RUN FOUND, AND WHY THIS ONE IS DIFFERENT. <==
# Run #1 answered the schema question and committed 112 MB doing it. Both
# facts shaped this version.
#
# 1. SEVERITY IS CARRIED EXPLICITLY. Every feature's <description> is a JSON
#    blob — {"peak_surge_range": "5-10 ft", "color": "red"} — and its
#    <styleUrl> says the same colour again. No style parsing, no inference.
#    The five colours are exactly blue/yellow/orange/red/purple.
#
# 2. THE RANGE IS PER FEATURE AND IT IS NOT THE RAMP LABEL. `SURGE_RAMP` in
#    config/tokens.js says "Up to 12 ft" for red. What NHC actually publishes
#    for a red area is 5-10, 6-10 or 8-12 ft, depending on the place. The
#    colour is a BUCKET; the range is the forecast. Both are kept here and the
#    range is the better thing to show.
#
# 3. SURGE IS NOT POLYGONS ONLY. Every advisory carries a Lines folder beside
#    Polygons, and the lines are real surge — "Suwannee River, FL to
#    Yankeetown, FL...3-5 ft". Roughly half the features. A renderer that
#    draws only bands drops half the product.
#
# 4. `Name` IS PLACE *AND* RANGE joined by "..." — "Tampa Bay...8-12 ft".
#    On the MapServer `name` is place-only, which is where §4.8's "never show
#    name as if it were a surge height" comes from. Here it is split apart and
#    the description JSON is trusted over it.
#
# ==> WHY THIS SIMPLIFIES, AND WHY THAT IS NOT A SHORTCUT. <==
# The live app never sees full-resolution surge: functions/api relays ask
# ArcGIS to generalize server-side (`maxAllowableOffset` ≈ 0.005°, §4.8), so
# the bytes are never sent at all. The archive hands over raw — advisory 013
# is 70,105 vertices and 3.5 MB.
#
# A fixture at full resolution would be PRETTIER THAN PRODUCTION, which makes
# it the wrong thing to judge a phone renderer against. It is simplified here
# to the same tolerance the relay asks for, using the app's OWN lib/simplify.js
# so the fixture and the app can never disagree about what a simplified ring
# is. The before/after vertex counts are printed and committed.
#
# The label and breakpoint POINT layers are dropped — we do not draw them.
# Only ONE raw KML is kept, as the schema record; keeping all 22 was 51 MB of
# bytes whose only job was to answer a question that is now answered.
#
# THE TOLERANCE LIVES HERE AND NOT IN config/constants.js ON PURPOSE. This is
# a build tool, not shipped code, and a half-wired SURGE constant that nothing
# reads would rot. It moves into constants.js in the same pass as the relay
# route that needs it, which is where §12 wants it.
#
# Output force-pushes `milton-surge` as main-plus-one-commit, so run #1's
# 112 MB does not stay in the branch's history. Never merged without a read.

name: milton-surge

on:
  push:
    branches: [milton-surge]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: gdal
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin

      - name: fetch
        run: |
          set -uo pipefail
          UA='Landfall/1.0 (+https://landfall.getgravitate.app)'
          BASE=https://www.nhc.noaa.gov/gis/peakSurge
          STORM=AL142024
          rm -rf /tmp/kml && mkdir -p /tmp/kml

          # Ask for every advisory id and its intermediate, and let the 404s
          # fall out. The archive is not uniform — Milton skips some numbers and
          # carries A-suffixed intermediates on others — and guessing which
          # exist is how a gap becomes silent (ida-gis.yml, same reasoning).
          IDS=""
          for n in $(seq -w 1 30); do IDS="$IDS 0$n 0${n}A"; done

          FOUND=0
          for id in $IDS; do
            url="$BASE/${STORM}_PeakStormSurge_${id}adv.kml"
            code=$(curl -sS -A "$UA" -o /tmp/s.kml -w '%{http_code}' "$url")
            [ "$code" = "200" ] || { echo "--   $id  HTTP $code"; continue; }
            cp /tmp/s.kml "/tmp/kml/${id}.kml"
            FOUND=$((FOUND + 1))
            echo "ok   $id  $(wc -c < /tmp/s.kml) bytes"
          done

          echo
          echo "TOTAL: $FOUND advisories, $(du -sh /tmp/kml | cut -f1)"
          [ "$FOUND" -gt 0 ] || { echo "NOTHING FETCHED." >&2; exit 1; }

      - name: convert
        run: |
          set -uo pipefail
          MERGE=$(command -v ogrmerge.py || command -v ogrmerge)
          mkdir -p /tmp/gj
          for kml in /tmp/kml/*.kml; do
            id=$(basename "$kml" .kml)
            # ogrmerge, not ogr2ogr: the KML is five FOLDERS and plain ogr2ogr
            # takes the first and silently drops the rest — which would look
            # exactly like a storm with only polygons and no coastal lines.
            "$MERGE" -single -overwrite_ds -f GeoJSON -o "/tmp/gj/$id.json" \
              -src_layer_field_name kml_folder "$kml"
            [ -s "/tmp/gj/$id.json" ] || { echo "conversion failed: $id" >&2; exit 1; }
          done
          echo "converted $(ls /tmp/gj | wc -l) advisories"

      - name: shape and simplify
        run: |
          set -uo pipefail
          OUT=samples/milton-al142024/surge
          rm -rf "$OUT" && mkdir -p "$OUT/raw"
          # ONE raw KML as the schema record. Run #1 kept all 22 (51 MB) to
          # answer what the archive contains; that is answered, and SCHEMA.md
          # holds the answer in text. Keeping one file means the claim can
          # still be checked against bytes rather than against a summary.
          for id in 008; do cp "/tmp/kml/$id.kml" "$OUT/raw/AL142024_PeakStormSurge_${id}adv.kml"; done
          node .github/scripts/milton-surge-shape.mjs | tee "$OUT/BUILD.md"
          cat "$OUT/BUILD.md" >> "$GITHUB_STEP_SUMMARY"

      # ==> READ THE REAL BYTES BEFORE ANYTHING IS BUILT AGAINST THEM. <==
      # Prints the raw KML head and ogrinfo's full layer listing verbatim.
      # Neither is parsed or summarised, because summarising is exactly where a
      # wrong assumption gets introduced.
      - name: probe
        run: |
          set -uo pipefail
          OUT=samples/milton-al142024/surge
          ONE="$OUT/raw/AL142024_PeakStormSurge_008adv.kml"
          {
            echo "# Milton (AL142024) peak storm surge — what the archive contains"
            echo
            echo "Probed file: \`$(basename "$ONE")\`"
            echo
            echo '## Raw KML, first 40 lines (one Placemark, with its description JSON)'
            echo '```xml'
            head -n 40 "$ONE"
            echo '```'
            echo
            echo '## Every distinct styleUrl and Style id across the kept advisories'
            echo '```'
            grep -ho -E '<styleUrl>[^<]*</styleUrl>|<Style id="[^"]*"' "$ONE" \
              | sort | uniq -c | sort -rn
            echo '```'
            echo
            echo '## ogrinfo: every layer and field'
            echo '```'
            ogrinfo -al -so "$ONE" 2>&1 | grep -E '^Layer name:|^Feature Count:|^[A-Za-z_]+: (String|Integer|Real|DateTime)'
            echo '```'
          } > "$OUT/SCHEMA.md"
          cat "$OUT/SCHEMA.md" >> "$GITHUB_STEP_SUMMARY"

      - name: commit
        run: |
          set -euo pipefail
          git config user.name  "Andy (Cowork)"
          git config user.email "andy@getgravitate.app"
          git add -A samples/milton-al142024/surge
          git commit -m "milton-surge: Milton's peak surge bands and coastal lines, per advisory" \
            || { echo "nothing to commit"; exit 0; }
          # FORCE, and from main rather than from the branch: run #1 committed
          # 112 MB of full-resolution geometry and raw KML, and rebuilding the
          # branch as main-plus-one leaves that commit unreferenced instead of
          # carrying it forever.
          git push --force origin HEAD:milton-surge
          du -sh samples/milton-al142024/surge
