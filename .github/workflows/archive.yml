# archive.yml — hourly snapshot of the live feeds, committed where a phone can
# read the exact bytes.
#
# THE PROBLEM THIS SOLVES
# A cloud session reaches GitHub and npm and nothing else. It cannot curl NHC,
# GDACS, JTWC, or our own app. WebFetch reaches them but hides response headers
# and approximates anything large. So "what exactly did the feed say" has been
# unanswerable from inside a session, and that has cost real debugging time.
# A runner has open internet. This is the bridge across that wall.
#
# HOW TO READ IT (works from a phone, on github.com, or with plain git)
#   git fetch origin archive
#   git show origin/archive:latest/nhc-currentstorms.json
#   git show origin/archive:latest/manifest.json     # includes X-Landfall-Cache
#
# WHY IT FORCE-PUSHES A SINGLE COMMIT
# The branch is rebuilt from scratch every hour and pushed as ONE orphan commit.
# 24 commits a day of near-identical JSON would bloat the repo forever, and
# nobody wants the history — the whole point is current bytes plus a short
# rolling window. Keeping one commit means the repo cannot grow without bound.
# `archive` is data, not code. Nothing is ever merged from it.

name: archive

on:
  schedule:
    # Top of every hour, UTC. NHC advisories land at 03/09/15/21Z with
    # intermediates in between, so hourly catches every one without guessing.
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive
  cancel-in-progress: false

env:
  # How many hourly snapshots to keep. 72 = three days, which covers a storm
  # from formation through landfall. Older ones are dropped, so the branch
  # stays roughly the same size forever instead of growing.
  KEEP_HOURS: 72

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout main (for the fetch script)
        uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: fetch the live feeds
        run: node tools/archive-fetch.mjs /tmp/new

      # The Cloudflare MCP is the other route to this data, and on 2026-08-08 it
      # was simply absent from a session with nobody noticing. A connector that
      # can silently not be there is a bad single route to the numbers that say
      # whether the app is healthy. The runner asks Cloudflare directly instead.
      #
      # No token set yet? The script says so in its manifest and exits 0. The
      # weather archive must not go red because a secret is missing.
      - name: pull the D1 telemetry
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/cloudflare-telemetry.mjs /tmp/telemetry

      - name: rebuild the archive branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          STAMP="$(date -u +%Y-%m-%dT%H0000Z)"

          # Start from whatever the archive branch currently holds, if anything.
          rm -rf /tmp/arc && mkdir -p /tmp/arc
          if git fetch --depth 1 origin archive 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C /tmp/arc
            echo "carried forward the existing archive branch"
          else
            echo "no archive branch yet — creating it"
          fi
          mkdir -p /tmp/arc/latest /tmp/arc/history

          # This hour's snapshot, kept whole including any .error.txt bodies.
          #
          # The rm is load-bearing. `cp -r src dst` copies INTO dst when dst
          # already exists, so a second run in the same UTC hour — a manual
          # dispatch after the scheduled one, which is exactly how this gets
          # tested — produced history/<hour>/new/ nested inside the real
          # snapshot instead of replacing it. Caught in a dry run 2026-08-08.
          rm -rf "/tmp/arc/history/$STAMP"
          mkdir -p "/tmp/arc/history/$STAMP"

          # ==> geometry/ IS THE ONE THING THAT DOES NOT GO INTO HISTORY. <==
          # Per-storm GDACS polygons are ~400 KB EACH and there can be a
          # handful of live storms, so a 72-hour window of them is roughly a
          # hundred megabytes of near-identical shapes. The rolling window
          # earns its size for event lists and bulletins, where "when did this
          # change" is a real question. For geometry the question is always
          # "what is the feed serving for this storm right now", and latest/
          # answers that completely. tools/archive-fetch.mjs says the same in
          # the manifest so nobody hunts for it in a snapshot.
          for f in /tmp/new/*; do
            base="$(basename "$f")"
            case "$base" in
              geometry) continue ;;
            esac
            cp -r "$f" "/tmp/arc/history/$STAMP/$base"
          done

          # Telemetry, same rule as the feeds below: a query that failed wrote no
          # file, so its previous good copy stays and the manifest says why it
          # is old. The manifest itself always updates.
          mkdir -p /tmp/arc/latest/telemetry
          rm -rf "/tmp/arc/history/$STAMP/telemetry"
          cp -r /tmp/telemetry "/tmp/arc/history/$STAMP/telemetry"
          for f in /tmp/telemetry/*; do
            [ -f "$f" ] && cp "$f" "/tmp/arc/latest/telemetry/$(basename "$f")"
          done

          # latest/ only ever holds parseable data. A source that failed leaves
          # its previous good bytes in place rather than being blanked — an
          # empty file reads as "no storms", and that confusion is precisely
          # the failure SPEC §5 forbids. manifest.json always updates, so the
          # staleness is stated rather than hidden.
          for f in /tmp/new/*; do
            base="$(basename "$f")"
            case "$base" in
              *.error.txt) continue ;;
            esac
            # ==> EVERY DIRECTORY IS SKIPPED HERE AND REBUILT BY THE LOOP
            # BELOW, AND THIS TEST IS WHY. <== A plain `cp` on a directory
            # exits 1 and `set -e` takes the whole job with it. This used to be
            # a hardcoded list of the three directories that existed —
            # geometry/, ships/, jtwc/ — with a comment warning that a
            # directory would blow the job up. On 2026-08-22 a3fb3b4 added a
            # fourth, adeck/, the list was not updated, and the archive stopped
            # dead for THIRTEEN HOURS across eleven scheduled runs. Nothing
            # noticed, because a branch that stops being force-pushed looks
            # exactly like a branch nobody changed. Asking the filesystem what
            # is a directory cannot go out of date the way a list can.
            if [ -d "$f" ]; then continue; fi
            cp "$f" "/tmp/arc/latest/$base"
          done

          # ==> EVERY DIRECTORY UNDER /tmp/new IS REBUILT FROM SCRATCH IN
          # latest/, WHICH BREAKS THE RULE DIRECTLY ABOVE ON PURPOSE. <==
          #
          # Everywhere else, a source that failed keeps its previous good bytes,
          # because stale-with-a-timestamp beats blank. These directories are
          # different in kind: none is a fixed set of sources, each is a MIRROR
          # OF THE CURRENT STORM SET, and their filenames carry storm ids —
          # GDACS event and episode ids in geometry/, ATCF ids in jtwc/, source
          # ids in adeck/, synoptic hours in ships/. Carrying files forward
          # would leave last week's storms sitting beside this hour's with
          # nothing on the filename saying which is which: a listing that looks
          # current and is not, which is the confusion SPEC §5 exists to forbid.
          # It would also grow without bound, one file per storm, forever.
          #
          # So each directory always says exactly what its feed is serving right
          # now. A storm whose fetch failed is simply absent, and manifest.json
          # carries the reason like every other failure.
          #
          # ==> WRITTEN AS ONE LOOP OVER WHATEVER IS THERE, NOT THREE NAMED
          # BLOCKS. <== It was three near-identical blocks, and a fourth
          # directory arriving without a fourth block is what killed eleven
          # consecutive runs on 2026-08-22. A new phase in
          # tools/archive-fetch.mjs now works here the hour it lands.
          #
          # WHAT IS EXPECTED TO BE MISSING, so a thin listing is not read as a
          # fault: ships/ requests two synoptic slots per storm and usually only
          # the older one is published, so roughly half are absent every run —
          # a run where SOME fail is normal, a run where ALL fail is the signal.
          # jtwc/ is legitimately EMPTY for stretches of the year, because JTWC
          # warns on nothing at all and its RSS says so in plain text.
          #
          # HISTORY IS A SEPARATE QUESTION and is decided in the loop further
          # up, which skips geometry/ alone. ships/, jtwc/ and adeck/ are all
          # small enough to keep for 72 hours and all answer "when did this
          # change" — whether a wind radius appears only near landfall, whether
          # a model cycle moved — which is answerable from consecutive runs and
          # from nothing else. geometry/ is ~400 KB per storm and answers only
          # "what is the feed serving right now", which latest/ answers whole.
          for d in /tmp/new/*/; do
            [ -d "$d" ] || continue
            base="$(basename "$d")"
            rm -rf "/tmp/arc/latest/$base"
            mkdir -p "/tmp/arc/latest/$base"
            for f in "$d"*; do
              [ -f "$f" ] || continue
              case "$(basename "$f")" in
                *.error.txt) continue ;;
              esac
              cp "$f" "/tmp/arc/latest/$base/$(basename "$f")"
            done
            echo "latest/$base holds $(ls -1 "/tmp/arc/latest/$base" | wc -l) file(s)"
          done

          # Prune. Snapshot directory names sort chronologically, so keeping the
          # tail is enough. This is the "clean up as we go" step — without it
          # the branch grows by ~24 directories a day forever.
          cd /tmp/arc/history
          COUNT="$(ls -1 | wc -l)"
          if [ "$COUNT" -gt "$KEEP_HOURS" ]; then
            ls -1 | sort | head -n "$((COUNT - KEEP_HOURS))" | while read -r old; do
              echo "pruning $old"
              rm -rf "$old"
            done
          fi
          echo "history now holds $(ls -1 | wc -l) snapshots (cap $KEEP_HOURS)"

          # A signpost at the root of the branch, so landing here from a
          # phone explains itself. Kept as a real file in tools/ rather than a
          # heredoc, because a heredoc inside an indented YAML block is a
          # whitespace trap nobody should have to debug at 2am.
          cp "$GITHUB_WORKSPACE/tools/archive-readme.md" /tmp/arc/README.md

          # One orphan commit, force-pushed. No history carried, on purpose.
          cd /tmp/arc
          rm -rf .git
          git init -q -b archive
          git config user.name  "Andy (Cowork)"
          git config user.email "andy@getgravitate.app"
          git add -A
          OKLINE="$(node -e "
            const m = require('/tmp/new/manifest.json');
            const t = require('/tmp/telemetry/manifest.json');
            console.log(m.ok + '/' + m.sources.length + ' sources ok, telemetry ' + t.state);
          ")"
          git commit -q -m "archive $STAMP — $OKLINE"
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" archive
          echo "pushed archive @ $STAMP — $OKLINE"

      - name: summary
        run: |
          node -e "
            const m = require('/tmp/new/manifest.json');
            const rows = m.sources.map(s =>
              '| ' + s.name + ' | ' + s.status + ' | ' + (s.http ?? '-') +
              ' | ' + s.bytes + ' | ' + (s.reason ?? '') + ' |').join('\n');
            console.log('## archive ' + m.fetchedAt + '\n');
            console.log('| source | status | http | bytes | note |');
            console.log('|---|---|---|---|---|');
            console.log(rows);
            const t = require('/tmp/telemetry/manifest.json');
            console.log('\n### telemetry: ' + t.state);
            if (t.reason) console.log('\n> ' + t.reason);
            if (t.queries && t.queries.length) {
              console.log('\n| query | status | rows |');
              console.log('|---|---|---|');
              console.log(t.queries.map(q =>
                '| ' + q.name + ' | ' + q.status + ' | ' + q.rows + ' |').join('\n'));
            }
          " >> "$GITHUB_STEP_SUMMARY"
